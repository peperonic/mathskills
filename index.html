/* =====================================================================
   UNDERWORLD: rounding step by step, two parallel examples per lesson, done by the student
   - dp_basic (2 d.p., wrong answer to question 1 or 2): 0.3333… -> 0.33, then 0.335 -> 0.34
   - dp_hard  (2 d.p., wrong answer to question 3): carrying past a 9 and keeping the zeros:
       0.597 -> 0.60, then 99.9999 -> 100.00 (Practice Set G, LibreTexts "Technical Mathematics" 1.2)
   - sf_basic (3 s.f., question 1 or 2): leading zeros are not significant, placeholder zeros stay:
       0.004567 -> 0.00457, then 45678 -> 45700 (accuracy-based rounding, LibreTexts 5.2)
   - sf_hard  (3 s.f., question 3): a 9 topples and the zeros at the end of a decimal count:
       29.97 -> 30.0, then 0.04996 -> 0.0500
   ===================================================================== */
const LESSONS = {
  dp_basic: { mode: "dp", n: 2, ex: [{ num: "0.3333333333333333", more: true }, { num: "0.335" }], pre: ["", "s6"] },
  dp_hard:  { mode: "dp", n: 2, ex: [{ num: "0.597" }, { num: "99.9999" }], pre: ["h1", "h2"] },
  sf_basic: { mode: "sf", n: 3, ex: [{ num: "0.004567" }, { num: "45678" }], pre: ["sfb1", "sfb2"] },
  sf_hard:  { mode: "sf", n: 3, ex: [{ num: "29.97" }, { num: "0.04996" }], pre: ["sfh1", "sfh2"] }
};
const CW = 34, X0 = 50, ROW_Y = 180;
const cellX = i => X0 + i * CW;
const udot = $("#udot"), ubar = $("#ubar"), marks = $("#marks"), numRow = $("#numRow");
let lesson = "dp_basic", ex = 0, ustep = 0, k = 0, ring = null, testArrow = null;
let sepI = -1, startI = 0, carryTarget = -1, carried = false;
const LS = () => LESSONS[lesson];
const curEx = () => LS().ex[ex];
const exAnswer = () => roundText(curEx().num, LS().mode, LS().n);

function buildDrifts() {
  const box = $("#drifts");
  box.innerHTML = "";
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("span");
    s.className = "drift";
    s.textContent = Math.floor(Math.random() * 10);
    s.style.left = (Math.random() * 780) + "px";
    s.style.animationDuration = (9 + Math.random() * 10) + "s";
    s.style.animationDelay = (-Math.random() * 18) + "s";
    box.appendChild(s);
  }
}
// Cell 0 is an empty spare place on the left, used when a carry needs a new digit (99.99… -> 100.00).
function buildRow(e) {
  const [whole, dec] = e.num.split(".");
  const chars = ["", ...whole, ...(dec !== undefined ? [SEP[lang], ...dec] : []), ...(e.more ? ["…"] : [])];
  sepI = dec !== undefined ? 1 + whole.length : -1;
  numRow.innerHTML = "";
  chars.forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "cell"; s.textContent = c; s.dataset.i = i;
    s.style.left = cellX(i) + "px";
    numRow.appendChild(s);
  });
}
const cellEl = i => numRow.children[i];
const isDigit = i => /^[0-9]$/.test(cellEl(i)?.textContent || "");
const isWhole = i => sepI < 0 || i < sepI;            // a place before the decimal point
const liveCells = () => [...numRow.children].filter(c => !c.classList.contains("sink"));
// the digits we count, from the start position (decimal point or first significant figure) to the right
const countList = () => [...numRow.children].map((c, i) => i).filter(i => i >= startI && isDigit(i));
const BEFORE = () => countList()[LS().n - 1];        // the rounding digit, just before the bar
const AFTER = () => countList()[LS().n];             // the test digit, just after the bar
function setPickable(test) {
  [...numRow.children].forEach((c, i) => c.classList.toggle("pick", !!test && test(i) && !c.classList.contains("sink")));
}
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function addArrow(i, blue) {
  const a = document.createElement("div");
  a.className = "arrow" + (blue ? " blue" : "");
  a.style.left = cellX(i) + "px";
  a.innerHTML = ARROW_SVG;
  marks.appendChild(a);
  return a;
}
function say(key, vars = {}, prefix = "", suffix = "") {
  markStep(key);
  let text = T(key);
  if (vars.x) text = text.replace("{x}", iso(vars.x));
  if (vars.d !== undefined) text = text.split("{d}").join(vars.d);
  return typeInto($("#uInstr"), [prefix, text, suffix].filter(Boolean).join(" "));
}
function exampleNumber(i) {
  const e = LS().ex[i];

  const [w, d] = e.num.split(".");
  return fmt(w + "." + d.slice(0, 4)) + "…";
}
const prefixFor = i => LS().pre[i] ? T(LS().pre[i]).replace("{x}", iso(exampleNumber(i))) : "";
function setupVideo() {

  setEraser(false);
  testArrow = null;

  $("#uFeed").textContent = "";

function beginSteps(prefix) {

}

numRow.addEventListener("click", async e => {
  const c = e.target.closest(".cell");
  if (!c || c.classList.contains("sink")) return;
  const i = +c.dataset.i;

  if (ustep === 1) {
    // 2 d.p.: the cursor goes on the decimal point. 3 s.f.: under the first digit that is not 0.
    const target = LS().mode === "dp" ? sepI : [...numRow.children].findIndex((x, j) => isDigit(j) && x.textContent !== "0");
    if (i !== target) return shake(c);
    ustep = 0; setPickable(null);
    udot.classList.remove("bob");
    udot.style.left = (cellX(i) + CW / 2) + "px";
    udot.style.top = (LS().mode === "dp" ? ROW_Y + 31 : ROW_Y + 56) + "px";
    await wait(650);
    udot.classList.add("placed");
    if (LS().mode === "dp") { c.classList.add("ghost"); startI = sepI + 1; } else startI = i;
    await wait(300);
    startCount();
  } else if (ustep === 3) {                            // click the digit after the bar: it turns red, a red arrow points at it
    if (i !== AFTER()) return shake(c);
    ustep = 0; setPickable(null);
    c.classList.add("test");
    testArrow = addArrow(i, false);
    testArrow.classList.add("down");
    await wait(600);
    const right = liveCells().map(x => +x.dataset.i).filter(j => j > AFTER());
    if (right.length) {
      ustep = 4; setPickable(j => j > AFTER()); setEraser(true);
      say("s4", {}, "", right.some(j => isDigit(j) && isWhole(j)) ? T("hold") : "");
    } else decide();
  } else if (ustep === 6) {                            // 5–9: make the digit before the bar jump up
    if (i !== BEFORE()) return shake(c);
    ustep = 0; setPickable(null);
    bump(i);
  } else if (ustep === 7) {                            // carry the 1 to the digit (or empty place) on the left
    if (i !== carryTarget) return shake(c);
    ustep = 0; setPickable(null);
    c.classList.remove("slot");
    marks.querySelectorAll(".carry").forEach(m => m.remove());
    bump(i);
  }
});

/* ---------- erasing (steps 4 and 5): nothing disappears until the student touches a digit to erase ---------- */
const uStage = numRow.closest(".stage");
let eraserOn = false, lastShake = -1, eraserReadyAt = 0;
function setEraser(on) {
  eraserOn = on;
  eraserReadyAt = performance.now() + 500;              // a short pause, so the click that led here can't erase anything
  uStage.classList.toggle("erasing", on);
}
// A digit is erased as soon as it is touched: moving over it, clicking it, tapping it or dragging across it.
uStage.addEventListener("pointerdown", e => { if (!eraserOn) return; e.preventDefault(); rubAt(e.clientX, e.clientY); });
uStage.addEventListener("pointermove", e => { if (eraserOn) rubAt(e.clientX, e.clientY); });
// Be generous: look at the mouse point and a little around it.
const RUB_SPOTS = [[0, 0], [-12, 0], [12, 0], [0, -12], [0, 12], [-9, -9], [9, 9], [-9, 9], [9, -9]];
function rubAt(x, y) {
  if (performance.now() < eraserReadyAt) return;
  const touched = [];
  for (const [dx, dy] of RUB_SPOTS) {
    const c = document.elementFromPoint(x + dx, y + dy)?.closest?.(".cell");
    if (c && numRow.contains(c) && !c.classList.contains("sink") && !touched.includes(c)) touched.push(c);
  }
  if (!touched.length) return;
  const ok = touched.find(c => (ustep === 4 && +c.dataset.i > AFTER()) || (ustep === 5 && +c.dataset.i === AFTER()));
  const c = ok || touched[0];
  erase(+c.dataset.i, c);
}
function nope(i, c) {                                   // rubbing the wrong digit: a small shake, once per pass
  if (lastShake === i) return;
  lastShake = i; shake(c); setTimeout(() => { lastShake = -1; }, 400);
}
function rubOut(j) {
  const x = cellEl(j);
  if (isDigit(j) && isWhole(j)) toZero(x);             // whole-number places turn into 0 to hold their place
  else x.classList.add("sink");                         // decimal places (and the decimal point) fall away
}
async function erase(i, c) {
  if (ustep === 4) {                                    // everything to the right of the red digit
    if (i <= AFTER()) return nope(i, c);
    ustep = 0; setPickable(null);
    const rest = [];
    for (let j = AFTER() + 1; j < numRow.children.length; j++) if (j !== i && !cellEl(j).classList.contains("sink")) rest.push(j);
    rubOut(i);                                          // the digit under the eraser goes first…
    rest.forEach((j, n) => setTimeout(() => rubOut(j), 300 + n * 70));   // …then the rest follow
    await wait(300 + rest.length * 70 + 900);
    setEraser(false);
    decide();
  } else if (ustep === 5) {                             // the red test digit itself
    if (i !== AFTER()) return nope(i, c);
    ustep = 0; setPickable(null);
    setEraser(false);
    c.classList.remove("test");
    rubOut(i);
    if (ring) ring.remove();
    if (testArrow) testArrow.remove();
    await wait(600);
    answerBox(true);
  }
}
// The answer box appears greyed out when the last step starts, so students see where to type,
// and unlocks as soon as the red digit has been erased.
function answerBox(open) {
  $("#uForm").hidden = false;
  $("#uInput").disabled = !open;
  $("#uCheck").disabled = !open;
  if (!open) $("#uForm").scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });   // make sure it is on screen
  if (open) { $("#uInput").value = ""; $("#uInput").focus({ preventScroll: true }); }
}
function toZero(c) { c.classList.remove("jump"); void c.offsetWidth; c.classList.add("jump"); setTimeout(() => { c.textContent = "0"; }, 240); }
const holdNote = () => isWhole(AFTER()) ? T("hold") : "";

/* look at the test digit after the bar: 0–4 stays, 5–9 jumps up */
function decide() {
  const d = +cellEl(AFTER()).textContent;
  const up = d >= 5;
  ring = document.createElement("div");
  ring.className = "ring"; ring.style.left = cellX(AFTER()) + "px";
  ring.innerHTML = `<b>${up ? "5–9" : "0–4"}</b>`;
  marks.appendChild(ring);
  if (up) { ustep = 6; setPickable(j => j === BEFORE()); say("s5up", { d }); }
  else    { ustep = 5; setPickable(j => j === AFTER()); setEraser(true); answerBox(false); say("s5down", { d }, "", holdNote()); }
}

/* add 1 to a digit; a 9 becomes 0 and the 1 is carried to the left (skipping the decimal point) */
async function bump(i) {
  const c = cellEl(i);
  marks.querySelectorAll(".plus").forEach(m => m.remove());   // only the current +1 is shown
  const p = document.createElement("div");
  p.className = "plus"; p.textContent = "+1"; p.style.left = (cellX(i) + 2) + "px";
  marks.appendChild(p);
  c.classList.remove("jump"); void c.offsetWidth; c.classList.add("jump");
  await wait(240);
  const v = c.textContent === "" ? 0 : +c.textContent;
  if (v < 9) {
    c.textContent = String(v + 1);
    await wait(700);
    ustep = 5; setPickable(j => j === AFTER()); setEraser(true); answerBox(false);
    const zeroKey = LS().mode === "dp" ? "zero" : "zeroSf";
    say(carried ? zeroKey : "s5up2", { d: cellEl(AFTER()).textContent }, "", holdNote());
    return;
  }
  // 9 + 1 = 10: write 0 here, carry 1 to the left
  c.textContent = "0";
  carried = true;
  let left = i - 1;
  if (left === sepI) left--;
  carryTarget = left;
  await wait(500);
  const t = cellEl(left);
  const bubble = document.createElement("div");
  bubble.className = "plus carry"; bubble.textContent = "1"; bubble.style.left = (cellX(left) + 8) + "px";
  marks.appendChild(bubble);
  const arc = document.createElement("div");
  arc.className = "hop carry blue-hop"; arc.style.left = (cellX(left) + 3 + (i - 1 === sepI ? CW / 2 : 0)) + "px";
  marks.appendChild(arc);
  const isNew = t.textContent === "";
  if (isNew) t.classList.add("slot");
  ustep = 7; setPickable(j => j === left);
  say(isNew ? "carryNew" : "carry");
}

/* step 2: drag the bar to count decimal places / significant figures */
function boundaries() {                                  // x position of the bar after counting 0, 1, 2… digits
  const list = countList();
  return [cellX(list[0]), ...list.map(j => cellX(j) + CW)];
}
function paintCount() {
  const b = boundaries();
  ubar.style.left = b[k] + "px";
  ubar.setAttribute("aria-valuenow", k);
  marks.querySelectorAll(".hop").forEach(h => h.remove());
  countList().slice(0, k).forEach((j, d) => {
    const h = document.createElement("div");
    h.className = "hop";
    h.style.left = (cellX(j) + 3) + "px";
    h.innerHTML = `<b>${d + 1}</b>`;
    marks.appendChild(h);
  });
  $("#uFeed").textContent = k > LS().n ? T(LS().mode === "dp" ? "far" : "farSf") : "";
}
function startCount() {
  ustep = 2; k = 0;
  ubar.setAttribute("aria-label", T(LS().mode === "dp" ? "s2" : "sf2"));
  ubar.hidden = false;
  ubar.setAttribute("aria-valuemax", countList().length);
  paintCount();
  say(LS().mode === "dp" ? "s2" : "sf2");
}
async function lockCount() {
  if (ustep !== 2 || k !== LS().n) return;
  ustep = 0;
  ubar.classList.add("locked");
  await wait(400);
  if (LS().mode === "dp") { for (let i = 1; i <= BEFORE(); i++) if (cellEl(i).textContent !== "") addArrow(i, false); }
  else countList().slice(1, LS().n).forEach(j => addArrow(j, false));   // the red dot already marks the first figure
  ustep = 3; setPickable(j => isDigit(j));
  say("s3");
}
function kFromPointer(e) {
  const st = ubar.closest(".stage"), rect = st.getBoundingClientRect(), s = st.clientWidth / 800;
  const x = (e.clientX - rect.left) / s;
  const b = boundaries();
  let best = 0;
  b.forEach((bx, i) => { if (Math.abs(bx - x) < Math.abs(b[best] - x)) best = i; });
  return best;
}
let dragging = false;
ubar.addEventListener("pointerdown", e => {
  if (ustep !== 2) return;
  dragging = true; ubar.classList.add("drag");
  ubar.setPointerCapture(e.pointerId);
});
ubar.addEventListener("pointermove", e => {
  if (!dragging) return;
  const nk = kFromPointer(e);
  if (nk !== k) { k = nk; paintCount(); }
});
ubar.addEventListener("pointerup", () => { dragging = false; ubar.classList.remove("drag"); lockCount(); });
ubar.addEventListener("keydown", e => {
  if (ustep !== 2) return;
  if (e.key === "ArrowRight") { k = Math.min(countList().length, k + 1); paintCount(); e.preventDefault(); }
  if (e.key === "ArrowLeft") { k = Math.max(0, k - 1); paintCount(); e.preventDefault(); }
  if (k === LS().n) setTimeout(lockCount, 350);
});

/* type the final answer */
// Checked from the button and the Enter key directly: some viewers (e.g. file previews)
// block form submission, which would leave the answer box stuck.
let answerChecking = false;
$("#uForm").addEventListener("submit", e => e.preventDefault());
$("#uCheck").addEventListener("click", e => { e.preventDefault(); checkAnswer(); });
$("#uInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkAnswer(); } });
async function checkAnswer() {
  if (answerChecking || $("#uInput").disabled) return;
  const want = exAnswer(), verdict = judge($("#uInput").value, want);
  if (verdict === "ok") {
    answerChecking = true;
    markStep("done");
    $("#uForm").hidden = true;
    $("#uFeed").textContent = T("ok") + "  " + iso(exampleNumber(ex) + "  →  " + fmt(want));
    await wait(1600);
    answerChecking = false;
    if (ex === 0) nextExample();
    else { $("#uBack").hidden = false; $("#uBack").focus({ preventScroll: true }); }
  } else {
    $("#uFeed").textContent = verdict === "zeros" ? T(LS().mode === "dp" ? "zeros" : "zerosSf") : T("no");
    shake($("#uInput"));
  }
}
// Practice for a level with mistakes. Quizzes: the underwater lessons for the questions that went wrong
// (questions 1-2 -> the basic lesson, question 3 -> the harder one), then the quiz again with new numbers.
// Games without underwater lessons are simply played again.
function practise(id) {
  lvl = id;
  const cfg = LEVELS[id];
  if (!cfg.lessons) return startIntro(id);
  const w = lastWrong[id] || [0, 1, 2];
  lessonQueue = [];
  if (w.some(q => q < 2)) lessonQueue.push(cfg.lessons[0]);
  if (w.includes(2)) lessonQueue.push(cfg.lessons[1]);
  enterUnder(lessonQueue.shift());
}

};

const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- the six topics, their place on the map and their two diagnostic questions ---------- */
// x, y: the stop on the 1280x720 map; lx, ly: its name label; icon: drawn on an empty plinth
const TOPICS = [
  { id: "round",  realm: "num",   x: 318, y: 440, lx: 232, ly: 505 },

  tenpow: [{ kind: "point", digits: "45", p0: 2, ans: 1, from: "mm", to: "cm", q: "qMm" },

const topicState = id => { const r = diag[id] || []; const n = r.filter(Boolean).length; return n === 2 ? "full" : n === 1 ? "half" : "none"; };
const topicName = id => T("t_" + id);
const hexName = id => T("hx_" + id).replace("|", " ");

function openHome() { return diagAt >= TOPICS.length ? openRealm() : openDiag(); }

/* ---------- the map ---------- */
function catmull(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const legPoints = i => [i === 0 ? [90, 600] : [TOPICS[i - 1].x, TOPICS[i - 1].y], ...LEGS[i], [TOPICS[i].x, TOPICS[i].y]];
function drawIcon(svg, t) {
  const g = svgEl("g", { class: "d-icon", transform: `translate(${t.ix},${t.iy})` });
  if (t.icon === "ruler") {
    g.innerHTML = `<rect x="-46" y="-12" width="92" height="22"/>` +
      [-36, -27, -18, -9, 0, 9, 18, 27, 36].map((x, i) => `<line x1="${x}" y1="-12" x2="${x}" y2="${i % 2 ? -5 : 0}"/>`).join("");
  } else if (t.icon === "tri") {
    g.innerHTML = `<path d="M-34,14 H30 V-26 Z"/><path d="M20,14 V4 H30"/>`;
  } else {
    g.innerHTML = `<path d="M-36,16 H38 M-30,22 V-30"/><path d="M-38,10 L30,-26" style="stroke-width:4"/>`;
  }
  svg.appendChild(g);
}
function label(svg, x, y, str, cls) {
  const g = svgEl("g", { class: cls });
  const t = svgEl("text", { x, y, direction: RTL[lang] ? "rtl" : "ltr" });
  t.textContent = str;
  const r = svgEl("rect", {});
  g.appendChild(r); g.appendChild(t);
  svg.appendChild(g);
  const b = t.getBBox();
  r.setAttribute("x", b.x - 10); r.setAttribute("y", b.y - 5);
  r.setAttribute("width", b.width + 20); r.setAttribute("height", b.height + 10);
  return g;
}
let dotLeg = -1;
function openDiag() {
  show("scr-diag");
  $("#dgTitle").textContent = T("diagTitle");
  const done = diagAt >= TOPICS.length;
  $("#dgNote").textContent = done ? T("diagNoteDone") : T("diagNote");
  const svg = $("#dgSvg");
  svg.innerHTML = "";
  svg.setAttribute("direction", "ltr");
  const all = TOPICS.flatMap((t, i) => legPoints(i).slice(i === 0 ? 0 : 1));
  svg.appendChild(svgEl("path", { class: "d-path", d: catmull(all) }));
  svg.appendChild(svgEl("path", { class: "d-path-in", d: catmull(all) }));
  // the two realms of the map
  label(svg, 330, 42, T("realmNum"), "d-realm inv");
  label(svg, 960, 690, T("realmSpace"), "d-realm inv");
  TOPICS.forEach(t => t.icon && drawIcon(svg, t));
  TOPICS.forEach((t, i) => {
    label(svg, t.lx, t.ly, hexName(t.id), "d-lab");
    const st = i < diagAt ? " done" : i === diagAt ? " next" : "";
    const g = svgEl("g", { class: "d-stop" + st });
    g.appendChild(svgEl("circle", { cx: t.x, cy: t.y, r: 24 }));
    const n = svgEl("text", { x: t.x, y: t.y + 1 }); n.textContent = i + 1; g.appendChild(n);
    if (i === diagAt) {
      g.setAttribute("tabindex", 0); g.setAttribute("role", "button");
      g.setAttribute("aria-label", topicName(t.id));
      activate(g, () => startDiagTopic(i));
    }
    svg.appendChild(g);
  });
  // the ball walks along the path to the next place
  const dot = svgEl("circle", { class: "d-dot", r: 13 });
  svg.appendChild(dot);
  const leg = Math.min(diagAt, TOPICS.length - 1);
  const p = svgEl("path", { d: catmull(legPoints(leg)), fill: "none" });
  svg.appendChild(p);
  const len = p.getTotalLength();
  const at = s => { const q = p.getPointAtLength(s); dot.setAttribute("cx", q.x); dot.setAttribute("cy", q.y - (done ? 0 : 34)); };
  if (done) { at(len); dot.setAttribute("cy", TOPICS[leg].y); }
  else if (dotLeg === leg || reduce) at(len);
  else {
    const t0 = performance.now(), dur = 1400;
    (function step(now) {
      const f = Math.min(1, (now - t0) / dur);
      at(len * (f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2));
      if (f < 1 && current === "scr-diag") requestAnimationFrame(step);
    })(t0);
  }
  dotLeg = leg;
  const go = $("#dgGo");
  go.textContent = done ? T("results") : T("diagGo").replace("{t}", topicName(TOPICS[diagAt].id));
  go.onclick = () => (done ? openRealm() : startDiagTopic(diagAt));
}

/* --- small builders for the billboard face --- */
function gWheel(min, max, val, onSpin, cls = "") {
  const w = document.createElement("div");
  w.className = "wheel " + cls;
  w.innerHTML =
    `<button class="wbtn" type="button" aria-label="+1"><svg viewBox="0 0 14 10"><path d="M7 0 L14 10 H0 Z"/></svg></button>` +
    `<div class="win"><span>${val}</span></div>` +
    `<button class="wbtn" type="button" aria-label="−1"><svg viewBox="0 0 14 10"><path d="M0 0 H14 L7 10 Z"/></svg></button>`;
  let v = val;
  const span = w.querySelector(".win span");
  const turn = d => {
    if (gBusy) return;
    v = v + d > max ? min : v + d < min ? max : v + d;
    span.textContent = v; span.className = ""; void span.offsetWidth; span.className = d > 0 ? "roll-up" : "roll-down";
    onSpin && onSpin(v);
  };
  w.children[0].addEventListener("click", () => turn(1));
  w.children[2].addEventListener("click", () => turn(-1));
  w.querySelector(".win").addEventListener("wheel", e => { e.preventDefault(); turn(e.deltaY < 0 ? 1 : -1); }, { passive: false });
  w.value = () => v;
  return w;
}
const span = (txt, cls) => { const s = document.createElement("span"); s.className = cls; s.textContent = txt; return s; };
function typeField(prefix) {
  const l = document.createElement("label");
  l.innerHTML = `<span></span><span class="typebox"><input inputmode="decimal" autocomplete="off" dir="ltr"></span>`;
  l.firstChild.textContent = prefix;
  const inp = l.querySelector("input");
  inp.placeholder = T("ans"); inp.setAttribute("aria-label", T("ans"));
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#gCheck").click(); } });
  return l;
}

/* --- figures (drawn inside the stage, left of the billboard) --- */
const FIG = 292;
function gridSvg(min, max, pad) {
  const u = (FIG - 2 * pad) / (max - min);
  const px = (x, y) => [pad + (x - min) * u, FIG - pad - (y - min) * u];
  let h = "";
  for (let v = min; v <= max; v++) {
    const [x] = px(v, 0), [, y] = px(0, v);
    h += `<line class="gl" x1="${x}" y1="${pad}" x2="${x}" y2="${FIG - pad}"/><line class="gl" x1="${pad}" y1="${y}" x2="${FIG - pad}" y2="${y}"/>`;
  }
  const [ox, oy] = px(Math.max(min, 0), Math.max(min, 0));
  h += `<line class="ga" x1="${pad - 4}" y1="${oy}" x2="${FIG - pad + 8}" y2="${oy}"/><line class="ga" x1="${ox}" y1="${FIG - pad + 4}" x2="${ox}" y2="${pad - 8}"/>`;
  h += `<text class="gn" x="${FIG - pad + 12}" y="${oy + 5}">x</text><text class="gn" x="${ox}" y="${pad - 12}">y</text>`;
  for (let v = min; v <= max; v++) {
    if (v === 0) continue;
    const [x] = px(v, 0), [, y] = px(0, v);
    if (max - min <= 8 || v % 2 === 0) {
      h += `<text class="gn" x="${x}" y="${oy + 18}">${v < 0 ? "−" + (-v) : v}</text>`;
      if (v !== 0) h += `<text class="gn" x="${ox - 12}" y="${y + 5}">${v < 0 ? "−" + (-v) : v}</text>`;
    }
  }

}
function figTriangle(a, b) {             // legs a (up) and b (along); the hypotenuse is c
  const s = Math.min(200 / b, 180 / a), x0 = 50, y0 = Math.round(150 + a * s / 2);
  const X = x0 + b * s, Y = y0 - a * s;
  return `<svg viewBox="0 0 ${FIG} ${FIG}"><polygon class="gtri" points="${x0},${y0} ${X},${y0} ${X},${Y}"/>` +
    `<path class="gright" d="M${X - 18},${y0} V${y0 - 18} H${X}"/>` +
    `<text class="gN" x="${(x0 + X) / 2}" y="${y0 + 30}">${b}</text>` +
    `<text class="gN" x="${X + 22}" y="${(y0 + Y) / 2 + 7}">${a}</text>` +
    `<text class="gN" x="${(x0 + X) / 2 - 16}" y="${(y0 + Y) / 2 - 8}" font-style="italic">c</text></svg>`;
}
function figLine(m, c) {
  const g = gridSvg(-5, 5, 24);
  // clip the line to the grid
  const xs = [-5, 5], pts = [];
  for (let x = -5; x <= 5; x += 0.01) { const y = m * x + c; if (y >= -5 && y <= 5) pts.push(g.px(x, y)); }
  const p0 = pts[0], p1 = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${FIG} ${FIG}">${g.h}<line class="gline" x1="${p0[0]}" y1="${p0[1]}" x2="${p1[0]}" y2="${p1[1]}"/></svg>`;
}

// Plot A and B by clicking the grid, then find the hypotenuse OB.
function setupPlot(q, face) {
  $("#gTagBox").classList.add("hide");
  const g = gridSvg(0, 6, 30);
  gFig.hidden = false;
  gFig.innerHTML = `<svg viewBox="0 0 ${FIG} ${FIG}" role="img">${g.h}<g class="gplot"></g></svg>`;
  const svg = gFig.querySelector("svg"), layer = svg.querySelector(".gplot");
  face.classList.add("col");
  const list = document.createElement("div"); list.className = "gtxt small"; list.dir = "ltr";
  list.textContent = "A " + coPair(...q.A) + "   B " + coPair(...q.B);
  const f = typeField("OB ="); f.hidden = true;
  face.appendChild(list); face.appendChild(f);
  $("#gCheck").disabled = true;
  let step = 0; q.plotOk = true; q.missed = [];
  const dot = (x, y, name, cls) => {
    const [X, Y] = g.px(x, y);
    layer.insertAdjacentHTML("beforeend", `<circle class="${cls}" cx="${X}" cy="${Y}" r="7"/><text class="gN" x="${X + 14}" y="${Y - 10}">${name}</text>`);
  };
  svg.onclick = e => {
    if (gBusy || step > 1) return;
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) * FIG / r.width, sy = (e.clientY - r.top) * FIG / r.height;
    const x = Math.round((sx - 30) / g.u), y = Math.round((FIG - 30 - sy) / g.u);
    if (x < 0 || x > 6 || y < 0 || y > 6) return;
    const want = step === 0 ? q.A : q.B, name = step === 0 ? "A" : "B";
    if (x === want[0] && y === want[1]) { dot(x, y, name, "gdot"); $("#gFeed").textContent = ""; }
    else {
      q.plotOk = false; q.missed.push(name + " " + coPair(...want));
      const [X, Y] = g.px(x, y);
      layer.insertAdjacentHTML("beforeend", `<g class="gmiss"><line x1="${X - 6}" y1="${Y - 6}" x2="${X + 6}" y2="${Y + 6}"/><line x1="${X - 6}" y1="${Y + 6}" x2="${X + 6}" y2="${Y - 6}"/></g>`);
      dot(want[0], want[1], name, "gdot");
      $("#gFeed").textContent = T("plotNo");
    }
    step++;
    if (step === 1) { $("#gHint").textContent = T("plotB").replace("{b}", iso(coPair(...q.B))); return; }
    // both points are there: draw the triangle O, A, B and ask for the hypotenuse
    const [ox, oy] = g.px(0, 0), [ax, ay] = g.px(...q.A), [bx, by] = g.px(...q.B);
    layer.insertAdjacentHTML("afterbegin",
      `<polygon class="gtri" points="${ox},${oy} ${ax},${ay} ${bx},${by}"/><line class="ghyp" x1="${ox}" y1="${oy}" x2="${bx}" y2="${by}"/>` +
      `<path class="gright" d="M${ax - 14},${ay} V${ay - 14} H${ax}"/>`);
    typeInto($("#gText"), T("qHyp"));
    $("#gHint").textContent = T("hType");
    list.hidden = true; f.hidden = false;
    $("#gCheck").disabled = false;
    f.querySelector("input").focus({ preventScroll: true });
  };
  q.read = () => {
    const ok = judge(f.querySelector("input").value, String(q.hyp)) === "ok";
    return { right: ok && q.plotOk, x: [...q.missed, ...(ok ? [] : ["OB = " + q.hyp])].join(", ") };
  };
}

const PRACTICE = {
  pt: () => {
    const kinds = [["mm", "cm", -1, "qMm"], ["cm", "m", -2, "qCm"], ["m", "cm", 2, "qMtoCm"], ["cm", "mm", 1, "qCmToMm"]];
    return [0, 1, 2, 3, 0, 1].map(k => {
      const [from, to, shift, qk] = kinds[k];
      let digits, p0;
      do {
        const len = 2 + Math.floor(Math.random() * 3);
        digits = String(1 + Math.floor(Math.random() * 9)) + Array.from({ length: len - 1 }, () => Math.floor(Math.random() * 10)).join("");
        digits = digits.replace(/0+$/, "") || "5";
        p0 = shift < 0 ? digits.length - Math.floor(Math.random() * 2) : 1 + Math.floor(Math.random() * (digits.length - 1));
      } while (p0 + shift < 0 || p0 + shift > digits.length || digits.length < 2 || p0 > digits.length);
      return { kind: "point", digits, p0, ans: p0 + shift, from, to, q: qk };
    });
  },
  pw: () => shuf([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, 6).map(e => ({ kind: "pow", n: "1" + "0".repeat(e), e })),
  sn: () => Array.from({ length: 6 }, (_, i) => {
    const e = 2 + Math.floor(Math.random() * 6);
    const digs = i < 2 ? 1 : i < 4 ? 2 : 3;
    let m = String(1 + Math.floor(Math.random() * 9));
    for (let d = 1; d < digs; d++) m += Math.floor(Math.random() * 10);
    m = m.replace(/0+$/, "") || m;
    const a = m.length > 1 ? m[0] + "." + m.slice(1) : m;
    const n = (m + "0".repeat(e + 1 - m.length));
    return { kind: "sci", n, a, e };
  }),
  py: () => shuf([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15], [7, 24, 25], [12, 16, 20]]).slice(0, 6)
    .map(([a, b, c]) => Math.random() < .5 ? { kind: "tri", a, b, c } : { kind: "tri", a: b, b: a, c }),
  ln: () => Array.from({ length: 6 }, () => {
    let m, c;
    do { m = pickR([-3, -2, -1, 1, 2, 3]); c = pickR([-3, -2, -1, 0, 1, 2, 3, 4]); } while (m === c);
    const o = [[m, c], [-m, c], [m, -c || c + 2], [c || 1, m]];
    const seen = new Set(), opts = [];
    o.forEach(p => { const k = p.join(); if (!seen.has(k)) { seen.add(k); opts.push(p); } });
    while (opts.length < 4) { const p = [pickR([-3, -2, -1, 1, 2, 3]), pickR([-3, -1, 0, 1, 2, 4])]; if (!seen.has(p.join())) { seen.add(p.join()); opts.push(p); } }
    return { kind: "line", m, c, opts };
  })
};

const STEP_OF = { s1: 1, sf1: 1, s2: 2, sf2: 2, s3: 3, s4: 4, s5up: 5, carry: 5, carryNew: 5, s5down: 6, s5up2: 6, zero: 6, zeroSf: 6 };
function buildSteps() {
  const ol = $("#uSteps");
  ol.innerHTML = "";
  const sf = LESSONS[lesson].mode === "sf";
  ["us1", "us2", "us3", "us4", "us5", "us6"].forEach(k => {
    const li = document.createElement("li");
    li.textContent = T(sf && (k === "us1" || k === "us2") ? k + "sf" : k);
    ol.appendChild(li);
  });
  $("#uTitle").textContent = T("underTitle") + ": " + T("u_" + lesson);
}
function markStep(key) {
  const lis = [...$("#uSteps").children];
  if (key === "done") { lis.forEach(li => { li.classList.remove("now"); li.classList.add("did"); }); return; }
  const n = STEP_OF[key];
  if (!n) return;
  lis.forEach((li, i) => { li.classList.toggle("did", i + 1 < n); li.classList.toggle("now", i + 1 === n); });
}

/* =====================================================================
   SCALE THE 800x420 WORLDS TO THE SCREEN
   ===================================================================== */
document.querySelectorAll(".stage").forEach(st => {
  const w = st.querySelector(".world");
  const fit = () => { w.style.transform = `scale(${st.clientWidth / 800})`; };
  new ResizeObserver(fit).observe(st);
  fit();
});

   ===================================================================== */
buildTitle();
buildWheels();
const boot = () => { fitLabels($("#hexTitle")); setTimeout(dropTittle, reduce ? 0 : 700); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
})();
