  /* Layout: one centred column per screen; game scenes are fixed 800x420 worlds scaled to the column width */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --mute: #8a8a92;
    --water: #0a2440;
    --red: #ff4136;
    --blue: #4d8dff;
    --font-ui: "Mathskills Pixel", "Vazirmatn", Tahoma, "Segoe UI", "Noto Sans Arabic", sans-serif;
    --font-px: var(--font-ui);
    color-scheme: dark;
  }
  :root[data-mode="light"] {
    --bg: #ffffff;
    --fg: #000000;
    --mute: #6d6d75;
    --water: #cfe7f5;
    --red: #e0261c;
    --blue: #1f5fd6;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100%; }
  body {
    font-family: var(--font-ui);
    font-size: 20px;
    line-height: 1.5;
    font-synthesis: none;
    -webkit-font-smoothing: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 40px;
    transition: background .25s, color .25s;
  }
  @media (pointer: fine) { html, body, * { cursor: none !important; } }

  /* ---------- dot cursor ---------- */
  #cursor {
    position: fixed; left: 0; top: 0; z-index: 1000;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: var(--fg);
    pointer-events: none; display: none;
    transition: width .15s, height .15s, margin .15s, background .25s;
  }
  #cursor.glide { transition: transform .35s ease-out, width .15s, height .15s, margin .15s; }
  #cursor.big { width: 22px; height: 22px; margin: -11px 0 0 -11px; }
  /* over anything that fills with the text colour on hover (white hexagons, buttons), the dot flips colour */
  #cursor.inv { background: var(--bg); }
  #cursor.off { opacity: 0; }

  /* ---------- HUD ---------- */
  .hud {
    max-width: 960px; margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px;
  }
  .logo {
    font: 20px/1 var(--font-ui);
    background: none; border: 0; color: var(--fg); padding: 6px 0;
  }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px;
    font: 20px/1 var(--font-ui); color: var(--fg);
    background: var(--bg); border: 2px solid var(--fg); border-radius: 999px; padding: 6px 12px 6px 8px;
    margin-inline-start: auto;
  }
  .toggle .sw { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fg);
    background: linear-gradient(90deg, var(--fg) 50%, var(--bg) 50%); }

  button, input { font-family: var(--font-ui); font-synthesis: none; }
  :focus-visible { outline: 3px dashed var(--fg); outline-offset: 3px; }

  .screen {
    max-width: 960px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
  }
  .btn {
    font: 20px/1 var(--font-ui); color: var(--fg); background: var(--bg);
    border: 3px solid var(--fg); padding: 12px 22px; box-shadow: 4px 4px 0 var(--fg);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--fg); }

  /* ---------- title + map ---------- */
  .title {
    font: clamp(40px, 9vw, 70px)/1 var(--font-ui); margin: 24px 0 0;
  }
  .title .i { position: relative; display: inline-block; line-height: 1; }
  /* the pixel dot of the i, drawn separately so it can fall off and become the cursor */
  .title .tittle { position: absolute; left: .2em; top: .15em; width: .2em; height: .1em; background: currentColor; }
  .hexes { width: min(440px, 100%); height: auto; overflow: visible; }
  .hex polygon { fill: var(--bg); stroke: var(--fg); stroke-width: 2.5; stroke-linejoin: round; transition: fill .15s; }
  .hex text { fill: var(--fg); font-family: var(--font-ui); text-anchor: middle; dominant-baseline: central; pointer-events: none; transition: fill .15s, opacity .15s; }
  .hex.on:hover polygon, .hex.on:focus-visible polygon { fill: var(--fg); }
  .hex.on:hover text, .hex.on:focus-visible text { fill: var(--bg); }
  .hex:focus { outline: none; }
  .hex.on:focus-visible polygon { stroke-dasharray: 6 4; }
  .map .lbl { opacity: 0; }
  .map .hex.on:hover .lbl, .map .hex.on:focus-visible .lbl, .map .hex.done .lbl { opacity: 1; }
  @media (hover: none) { .map .hex.on .lbl { opacity: 1; } }
  .map .hex.done polygon { fill: var(--fg); stroke: var(--bg); stroke-width: 4; }   /* thin dark edges keep white levels apart */
  .map .hex.visited polygon { fill: color-mix(in srgb, var(--fg) 14%, var(--bg)); }
  .map .hex.practice polygon { stroke: var(--red); stroke-dasharray: 8 5; }
  .map .hex.practice .lbl, .map .hex.done .lbl { opacity: 1; }
  .map .hex.practice:hover polygon { fill: var(--red); }
  .map .hex.done text { fill: var(--bg); }
  .map-note { color: var(--mute); font-size: 20px; margin: 0; }

  /* ---------- intro / done ---------- */
  /* the big old-school typewriter text, typed in the player's language */
  .big-type { width: 100%; margin: 0; font: clamp(26px, 4.2vw, 40px)/1.45 var(--font-ui); text-transform: uppercase; text-align: start; min-height: 4.4em; }
  .big-type::after {
    content: ""; display: inline-block; width: .55em; height: .7em; margin-inline-start: .2em;
    background: currentColor; animation: blink .8s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  .sub { font-size: 20px; line-height: 1.6; max-width: 52ch; margin: 0; min-height: 1.5em; }
  .intro-wrap { width: 100%; display: flex; flex-direction: column; gap: 22px; align-items: center; padding-top: 24px; }

  /* ---------- scenes ---------- */
  .q-text { font: 20px/1.6 var(--font-ui); margin: 6px 0 0; max-width: 48ch; text-wrap: balance; min-height: 2.6em; }
  .q-hint { color: var(--mute); margin: 0; font-size: 20px; line-height: 1.6; max-width: 56ch; }
  .feed { min-height: 1.5em; margin: 0; font-size: 20px; max-width: 56ch; }
  .stage { position: relative; width: 100%; aspect-ratio: 800 / 420; overflow: hidden; max-width: 100%; }
  .world { position: absolute; left: 0; top: 0; width: 800px; height: 420px; transform-origin: 0 0; direction: ltr; }
  .world.fade { transition: opacity .3s; opacity: 0; }

  .progress { position: absolute; right: 16px; top: 14px; display: flex; gap: 8px; }
  .progress i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); }
  .progress i.ok { background: var(--fg); }
  .progress i.bad { border-color: var(--red); background: linear-gradient(45deg, transparent 42%, var(--red) 42% 58%, transparent 58%), linear-gradient(-45deg, transparent 42%, var(--red) 42% 58%, transparent 58%); }

  .ground {
    position: absolute; left: 0; right: 0; top: 360px; height: 60px;
    border-top: 4px solid var(--fg);
    background:
      repeating-linear-gradient(0deg, transparent 0 18px, var(--fg) 18px 20px),
      repeating-linear-gradient(90deg, transparent 0 38px, var(--fg) 38px 40px);
  }
  .hole { position: absolute; left: 70px; top: 360px; width: 80px; height: 60px; background: var(--bg); opacity: 0; }
  .hole.open { opacity: 1; }
  .trap {
    position: absolute; left: 70px; top: 360px; width: 80px; height: 20px;
    border-top: 4px solid var(--fg); background: repeating-linear-gradient(90deg, transparent 0 38px, var(--fg) 38px 40px);
    transform-origin: 0 0; transition: transform .35s ease-in;
  }
  .trap.open { transform: rotate(80deg); }

  .ball {
    position: absolute; left: 96px; top: 332px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--fg); transition: left 1.1s ease-in-out, top .7s cubic-bezier(.55, 0, 1, .45);
  }
  .tag { position: absolute; left: 170px; top: 278px; width: 128px; height: 82px; }
  .tag .paper {
    position: relative; z-index: 1; border: 3px solid var(--fg); background: var(--bg); padding: 10px 6px;
    font: 20px/1 var(--font-px); white-space: nowrap; text-align: center;
  }
  .tag .stick { position: absolute; left: 60px; top: 36px; width: 6px; height: 46px; background: var(--fg); }

  .board { position: absolute; left: 318px; top: 96px; width: 264px; height: 264px; }
  .board .face {
    position: relative; z-index: 1; height: 168px; border: 4px solid var(--fg); background: var(--bg);
    box-shadow: 6px 6px 0 var(--fg); display: flex; align-items: center; justify-content: center;
  }
  .board .pole { position: absolute; left: 124px; top: 168px; width: 16px; height: 96px; background: var(--fg); }
  .board .check { position: absolute; left: 62px; top: 190px; width: 140px; z-index: 2; padding: 10px 6px; }
  .wheels { display: flex; align-items: center; gap: 6px; }
  .typebox input {
    width: 220px; font: 30px/1 var(--font-px); padding: 14px 8px; text-align: center;
    background: var(--bg); color: var(--fg); border: 3px solid var(--fg);
  }
  .typebox input::placeholder { color: var(--mute); }
  .wheel { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .wbtn {
    width: 40px; height: 28px; border: 3px solid var(--fg); background: var(--bg); color: var(--fg);
    display: grid; place-items: center; padding: 0;
  }
  .wbtn:hover { background: var(--fg); color: var(--bg); }
  .wbtn svg { width: 14px; height: 10px; fill: currentColor; }
  .win {
    width: 44px; height: 52px; border: 3px solid var(--fg); display: grid; place-items: center;
    font: 30px/1 var(--font-px); overflow: hidden;
  }
  .win span { display: block; }
  .win span.roll-up { animation: rollUp .14s ease-out; }
  .win span.roll-down { animation: rollDown .14s ease-out; }
  @keyframes rollUp { from { transform: translateY(60%); opacity: 0; } }
  @keyframes rollDown { from { transform: translateY(-60%); opacity: 0; } }
  .wsep { font: 30px/1 var(--font-px); align-self: center; margin-top: 18px; width: 14px; text-align: center; }
  .weur { font: 30px/1 var(--font-ui); margin-left: 4px; }

  .barrier { position: absolute; left: 610px; top: 280px; width: 170px; height: 80px; }
  .barrier .post { position: absolute; left: 140px; top: 0; width: 16px; height: 80px; background: var(--fg); }
  .barrier .bar {
    position: absolute; left: 0; top: 18px; width: 148px; height: 18px; border: 3px solid var(--fg);
    background: repeating-linear-gradient(90deg, var(--fg) 0 18px, var(--bg) 18px 36px);
    transform-origin: 140px 50%; transition: transform .6s cubic-bezier(.3, 1.4, .6, 1);
  }
  .barrier .bar.open { transform: rotate(78deg); }

  /* ---------- level 3: decimal pilot ---------- */
  .shoot-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
  .lives { display: flex; gap: 8px; }
  .heart svg { width: 21px; height: 18px; display: block; fill: var(--red); }
  .heart.lost svg { fill: none; stroke: var(--mute); stroke-width: .5; }
  .sky { border: 3px solid var(--fg); background: var(--bg); touch-action: none; user-select: none; }
  .star { position: absolute; width: 4px; height: 4px; background: var(--fg); opacity: .3; }
  .danger { position: absolute; left: 0; right: 0; top: 344px; border-top: 2px dashed color-mix(in srgb, var(--red) 55%, transparent); }
  .aim { position: absolute; top: 0; height: 352px; border-left: 2px dashed color-mix(in srgb, var(--fg) 22%, transparent); pointer-events: none; }
  .plane { position: absolute; top: 356px; width: 52px; height: 40px; pointer-events: none; }
  .plane svg { width: 100%; height: 100%; display: block; }
  .plane rect { fill: var(--fg); }
  .plane rect.nose { fill: var(--red); }
  .plane.hit { animation: shake .4s 2; }
  .falling { position: absolute; height: 44px; pointer-events: none; }
  .fcell { position: absolute; top: 0; width: 48px; text-align: center; font: 40px/44px var(--font-px); color: var(--fg); }
  .fcell.zero { color: var(--blue); }
  .fsep { position: absolute; top: 0; width: 20px; margin-left: -10px; text-align: center; font: 40px/44px var(--font-px); color: var(--fg); }
  .fsep.bad { color: var(--red); }
  .funit { position: absolute; top: 4px; font: 30px/40px var(--font-px); color: var(--mute); white-space: nowrap; }
  .funit.m { color: var(--fg); }
  .falling.scored { animation: winPop .75s ease-out forwards; }
  @keyframes winPop { 30% { transform: scale(1.15); } to { transform: scale(1.3) translateY(-30px); opacity: 0; } }
  .falling.crash .fcell { animation: crashOut .8s ease-in forwards; }
  @keyframes crashOut { to { transform: translate(var(--dx, 0), 90px) rotate(60deg); opacity: 0; } }
  .shot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--fg); pointer-events: none; }
  .plus1 { position: absolute; font: 20px/1 var(--font-px); color: var(--fg); animation: rise 1s ease-out forwards; pointer-events: none; }
  @keyframes rise { to { transform: translateY(-40px); opacity: 0; } }
  .shoot-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px; text-align: center; background: color-mix(in srgb, var(--bg) 78%, transparent);
  }
  .shoot-overlay p { margin: 0; max-width: 34ch; }

  /* ---------- level 1: number line ---------- */
  .nl-axis { position: absolute; left: 30px; width: 740px; top: 299px; height: 4px; background: var(--fg); }
  .nl-axis::after { content: ""; position: absolute; right: -14px; top: -8px; border: 10px solid transparent; border-left: 14px solid var(--fg); border-right: 0; }
  .nl-tick { position: absolute; top: 289px; width: 4px; height: 24px; margin-left: -2px; background: var(--fg); }
  .nl-tick::before { content: ""; position: absolute; left: -20px; right: -20px; top: -24px; bottom: -44px; }
  .nl-tick.pick:hover { background: var(--blue); }
  .nl-tick.yes { background: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 35%, transparent); }
  .nl-tick.no { animation: shake .3s; background: var(--red); }
  .nl-lab { position: absolute; top: 324px; width: 80px; margin-left: -40px; text-align: center; font: 20px/1 var(--font-px); color: var(--fg); }
  .nl-lab.hid { visibility: hidden; }
  .nl-lab.rev { color: var(--mute); }
  .nl-lab.filled { color: var(--blue); }
  .nl-in {
    position: absolute; top: 318px; width: 80px; margin-left: -40px; padding: 4px 2px; text-align: center;
    font: 20px/1 var(--font-px); background: var(--bg); color: var(--fg); border: 3px solid var(--blue);
  }
  .nl-in.bad { border-color: var(--red); animation: shake .3s; }
  .nl-in.ok { border-color: var(--fg); }
  .nl-num {
    position: absolute; transform: translateX(-50%); padding: 8px 12px; white-space: nowrap;
    font: 30px/1 var(--font-px); background: var(--bg); color: var(--fg); border: 3px solid var(--fg); pointer-events: none;
  }
  .nl-num::after { content: ""; position: absolute; left: 50%; bottom: -15px; margin-left: -9px; border: 9px solid transparent; border-top: 12px solid var(--fg); border-bottom: 0; }
  .nl-guide { position: absolute; border-left: 2px dashed color-mix(in srgb, var(--fg) 30%, transparent); pointer-events: none; }
  .nl-mark { position: absolute; top: 294px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--red); transition: left .6s ease-in-out; }
  .nl-mlab { position: absolute; transform: translateX(-50%); font: 20px/1 var(--font-px); color: var(--red); white-space: nowrap; transition: left .6s ease-in-out; }
  .nl-hop { position: absolute; top: 276px; height: 16px; border: 3px solid var(--blue); border-bottom: 0; border-radius: 40px 40px 0 0; }
  #nlMarks, #nlDrop { pointer-events: none; }

  .shake { animation: shake .3s; }

  /* ---------- level 5: coordinates ---------- */
  .co-hud { max-width: 520px; }
  .co-wrap { width: min(520px, 100%); }
  #coSvg { display: block; width: 100%; height: auto; border: 3px solid var(--fg); background: var(--bg); touch-action: manipulation; }
  .co-grid { stroke: color-mix(in srgb, var(--fg) 25%, transparent); stroke-width: 1; }
  .co-grid.half { stroke-dasharray: 2 4; }
  .co-axis { stroke: var(--fg); stroke-width: 3; }
  .co-lab { fill: var(--fg); font: 14px var(--font-px); text-anchor: middle; }
  .co-name { fill: var(--fg); font: 20px var(--font-px); text-anchor: middle; }
  .co-line { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linejoin: round; }
  .co-line.closed { fill: color-mix(in srgb, var(--blue) 28%, transparent); }
  .co-dot { fill: var(--red); }
  .co-dot.flash { animation: coFlash .7s steps(2, start) infinite; }
  @keyframes coFlash { to { visibility: hidden; } }
  .co-miss line { stroke: var(--red); stroke-width: 3; }
  .co-in { font-size: 20px; display: inline-flex; align-items: center; gap: 8px; }
  .co-in input { width: 6ch; font: 20px/1 var(--font-px); padding: 10px 6px; text-align: center; background: var(--bg); color: var(--fg); border: 3px solid var(--fg); }

  /* ---------- level 6: standard form ---------- */
  .sfm-board { width: 100%; text-align: start; }
  .sfm-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 4px 0 18px; }
  .sfm-chip, .sfm-arrow {
    font: 20px/1.2 var(--font-ui); padding: 10px 14px; border: 3px solid var(--fg); background: var(--bg); color: var(--fg);
  }
  .sfm-arrow::after { content: " →"; }
  .sfm-chip:hover, .sfm-arrow:hover, .sfm-chip.sel, .sfm-arrow.sel { background: var(--fg); color: var(--bg); }
  .sfm-chip.used, .sfm-arrow.used { visibility: hidden; }
  .sfm-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .sfm-card {
    display: flex; flex-direction: column; gap: 8px; padding: 12px; min-height: 92px; text-align: start;
    font: 20px/1.3 var(--font-ui); border: 3px solid var(--fg); background: var(--bg); color: var(--fg);
  }
  .sfm-card.small { min-height: 0; }
  .sfm-card.ok { border-color: var(--blue); }
  .sfm-card.used { opacity: .2; pointer-events: none; }
  .sfm-slot { color: var(--blue); min-height: 1.3em; overflow-wrap: anywhere; }
  .sfm-rows { display: flex; flex-direction: column; gap: 10px; }
  .sfm-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 10px 12px; border: 3px solid var(--fg); }
  .sfm-row.ok { border-color: var(--blue); }
  .sfm-row.bad { border-color: var(--red); animation: shake .3s; }
  @media (max-width: 760px) { .sfm-row { grid-template-columns: 1fr; gap: 8px; } }
  .sfm-len { color: var(--mute); }
  .sfm-std { white-space: nowrap; }
  .sfm-std input { width: 3ch; font: 20px/1 var(--font-px); padding: 6px 2px; text-align: center; background: var(--bg); color: var(--fg); border: 3px solid var(--fg); }
  .sfm-std sup input { width: 4ch; font-size: 20px; }
  .sfm-row.ok input { border-color: var(--blue); color: var(--blue); }
  .sfm-ladder { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .sfm-step { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; border: 3px solid var(--fg); }
  .sfm-gap { display: flex; justify-content: center; }
  .sfm-gapbox { min-width: 9em; padding: 6px 14px; text-align: center; border: 3px dashed var(--mute); color: var(--mute); }
  .sfm-gap.ok .sfm-gapbox { border-style: solid; border-color: var(--blue); color: var(--blue); }
  sup { font-size: .75em; line-height: 0; }

  /* ---------- underworld ---------- */
  .video {
    width: min(360px, 100%); aspect-ratio: 16 / 9; border: 3px dashed var(--fg);
    display: grid; place-items: center; align-content: center; gap: 10px; color: var(--mute); font-size: 20px;
  }
  .video .play { width: 0; height: 0; border-left: 22px solid var(--fg); border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .video video { width: 100%; height: 100%; display: block; background: #000; }
  .instr { font: 20px/1.6 var(--font-ui); margin: 0; max-width: 52ch; min-height: 3.2em; }
  .water { background: var(--water); border: 3px solid var(--fg); transition: background .25s; }
  .water::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0 22px, color-mix(in srgb, var(--fg) 7%, transparent) 22px 24px);
  }
  .drift { position: absolute; bottom: -40px; font: 20px/1 var(--font-px); color: var(--fg); opacity: .18; animation: drift linear infinite; }
  @keyframes drift { to { transform: translateY(-500px); } }
  .cell {
    position: absolute; top: 180px; width: 34px; height: 40px; text-align: center;
    font: 30px/40px var(--font-px); color: var(--fg); user-select: none;
    transition: transform .7s cubic-bezier(.5, 0, 1, .6), opacity .7s;
  }
  .cell.sink { transform: translateY(190px) rotate(25deg); opacity: 0; }
  .cell.shake { animation: shake .3s; }
  .cell.jump { animation: jump .6s ease-out; }
  .cell.ghost { color: transparent; }
  .cell.test { color: var(--red); }
  .stage.erasing { touch-action: none; }
  .cell.slot { outline: 3px dashed var(--blue); outline-offset: -3px; }
  .blue-hop { border-color: var(--blue); }
  .cell.pick:hover { background: color-mix(in srgb, var(--fg) 15%, transparent); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes jump { 40% { transform: translateY(-38px); } }
  .udot {
    position: absolute; left: 400px; top: -30px; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: var(--fg); transition: left .6s ease-in-out, top .9s cubic-bezier(.3, 1.35, .6, 1), background .3s;
  }
  .udot.bob { animation: bob 2.4s ease-in-out infinite; }
  .udot.placed { background: var(--red); }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .ubar {
    position: absolute; top: 166px; width: 6px; height: 68px; margin-left: -3px; background: var(--red);
    touch-action: none; transition: left .12s;
  }
  .ubar::before { content: ""; position: absolute; inset: -6px -9px; }
  .ubar.locked { pointer-events: none; }
  .ubar:not(.locked):hover, .ubar.drag { box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 35%, transparent); }
  #marks, #drifts, .udot { pointer-events: none; }
  .hop { position: absolute; top: 158px; width: 28px; height: 14px; border: 3px solid var(--red); border-bottom: 0; border-radius: 16px 16px 0 0; }
  .hop b { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font: 10px/1 var(--font-px); color: var(--red); }
  .arrow { position: absolute; top: 228px; width: 34px; display: grid; place-items: center; color: var(--red); }
  .arrow.blue { color: var(--blue); transition: left .2s; }
  .arrow.down { top: 132px; }
  .arrow.down svg { transform: rotate(180deg); }
  .arrow svg { width: 18px; height: 30px; fill: currentColor; }
  .ring { position: absolute; top: 176px; width: 44px; height: 48px; margin-left: -5px; border: 3px solid var(--blue); border-radius: 50%; }
  .ring b { position: absolute; left: 50px; top: -26px; font: 20px/1 var(--font-px); color: var(--blue); white-space: nowrap; }
  .plus { position: absolute; top: 116px; font: 20px/1 var(--font-px); color: var(--blue); }
  .answer { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .answer input:disabled, .answer button:disabled { opacity: .35; }
  .answer button:disabled { box-shadow: none; }
  .answer input {
    font: 20px/1 var(--font-px); width: 9ch; padding: 10px; text-align: center;
    background: var(--bg); color: var(--fg); border: 3px solid var(--fg);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* =====================================================================
     DIAGNOSTIC LAND, GATES, LEARNING REALM, TOPIC PAGES (added for v5)
     ===================================================================== */
  /* the map: the old illustrated land as black line art; in dark mode the picture is inverted */
  .dmap { position: relative; width: 100%; aspect-ratio: 1280 / 720; border: 3px solid var(--fg); overflow: hidden; }
  .dmap img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  :root:not([data-mode="light"]) .dmap img { filter: invert(1); }
  .dmap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .d-path { fill: none; stroke: var(--fg); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .d-path-in { fill: none; stroke: var(--bg); stroke-width: 3; stroke-dasharray: 10 12; stroke-linecap: round; }
  .d-stop circle { fill: var(--bg); stroke: var(--fg); stroke-width: 4; }
  .d-stop text { fill: var(--fg); font: 22px var(--font-ui); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .d-stop.done circle { fill: var(--fg); }
  .d-stop.done text { fill: var(--bg); }
  .d-stop.next circle { stroke-width: 6; animation: dPulse 1.2s ease-in-out infinite; }
  .d-stop.next { cursor: pointer; }
  .d-stop.next:hover circle, .d-stop.next:focus-visible circle { fill: var(--fg); }
  .d-stop.next:hover text, .d-stop.next:focus-visible text { fill: var(--bg); }
  .d-stop:focus { outline: none; }
  @keyframes dPulse { 50% { stroke-width: 10; } }
  .d-lab rect { fill: var(--bg); stroke: var(--fg); stroke-width: 2.5; }
  .d-lab text { fill: var(--fg); font: 19px var(--font-ui); text-anchor: middle; dominant-baseline: central; }
  .d-realm text { fill: var(--fg); font: 22px var(--font-ui); text-anchor: middle; dominant-baseline: central; letter-spacing: .5px; }
  .d-realm rect { fill: var(--fg); }
  .d-realm.inv text { fill: var(--bg); }
  .d-icon { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .d-icon text { fill: var(--fg); stroke: none; font: 18px var(--font-ui); text-anchor: middle; }
  .d-dot { fill: var(--fg); stroke: var(--bg); stroke-width: 3; }
  .d-note { color: var(--mute); }

  /* gates: the billboard of the old level, with the screen changing per question */
  .g-fig { width: min(460px, 100%); border: 3px solid var(--fg); background: var(--bg); }
  .g-fig svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
  .g-fig .gl { stroke: color-mix(in srgb, var(--fg) 25%, transparent); stroke-width: 1; }
  .g-fig .ga { stroke: var(--fg); stroke-width: 3; }
  .g-fig .gn { fill: var(--fg); font: 14px var(--font-px); text-anchor: middle; }
  .g-fig .gN { fill: var(--fg); font: 20px var(--font-ui); text-anchor: middle; }
  .g-fig .gline { stroke: var(--blue); stroke-width: 4; fill: none; stroke-linecap: round; }
  .g-fig .gtri { stroke: var(--fg); stroke-width: 4; fill: color-mix(in srgb, var(--blue) 25%, transparent); stroke-linejoin: round; }
  .g-fig .ghyp { stroke: var(--blue); stroke-width: 5; }
  .g-fig .gdot { fill: var(--red); }
  .g-fig .gright { fill: none; stroke: var(--fg); stroke-width: 2.5; }
  .g-fig .gmiss line { stroke: var(--red); stroke-width: 3; }
  .g-fig .ghint { fill: none; stroke: var(--red); stroke-width: 2; stroke-dasharray: 4 4; }
  #gWorld .board.wide { left: 222px; width: 376px; }
  #gWorld .board .pole { left: calc(50% - 8px); }
  #gWorld .board .check { left: calc(50% - 70px); }
  #gWorld .tag.hide { display: none; }
  .gface { display: flex; align-items: center; justify-content: center; gap: 6px; direction: ltr; }

<body>

<header class="hud">
  <button class="logo" id="hudLogo" type="button" hidden>Mathskills</button>
  <button class="toggle" id="toggle" type="button" aria-pressed="false"><span class="sw" aria-hidden="true"></span><span id="toggleLbl">Invert</span></button>
</header>

<!-- 1. Title: each hexagon says "start" in one language -->
<main class="screen" id="scr-title">
  <h1 class="title">Mathsk<span class="i">ı<span class="tittle" id="tittle"></span></span>lls</h1>
  <svg class="hexes" id="hexTitle" viewBox="-160 -64 320 308"></svg>
</main>

<!-- 2. Map: blank hexagons, only the bottom-left one (Rounding to 2 d.p.) is open -->
<section class="screen map" id="scr-map" hidden>
  <h1 class="title" style="font-size:clamp(34px,7vw,52px)">Mathskills</h1>
  <p class="sub" id="mapNote" aria-live="polite"></p>
  <svg class="hexes" id="hexMap" viewBox="-160 -64 320 308"></svg>
</section>

<!-- 3. Intro: old-school typewriter text -->
<section class="screen" id="scr-intro" hidden>
  <div class="intro-wrap">
    <p class="big-type" id="introText"></p>
    <button class="btn" id="playBtn" type="button" hidden></button>
  </div>
</section>

<!-- 4. Level: three billboard questions -->
<section class="screen" id="scr-level" hidden>
  <h2 class="q-text" id="qText" aria-live="polite"></h2>
  <p class="q-hint" id="qHint"></p>
  <div class="stage">
    <div class="world" id="lvWorld">
      <div class="progress" id="prog"><i></i><i></i><i></i></div>
      <div class="ground"></div>
      <div class="hole" id="hole"></div>
      <div class="trap" id="trap"></div>
      <div class="tag"><div class="paper" id="tagNum"></div><div class="stick"></div></div>
      <div class="board">
        <div class="face">
          <div class="wheels" id="wheels"></div>
          <div class="typebox" id="typeBox" hidden><input id="typeIn" inputmode="decimal" autocomplete="off" dir="ltr"></div>
        </div>
        <div class="pole"></div>
        <button class="btn check" id="checkBtn" type="button"></button>
      </div>
      <div class="barrier"><div class="bar" id="bar"></div><div class="post"></div></div>
      <div class="ball" id="ball"></div>
    </div>
  </div>
  <p class="feed" id="qFeed" aria-live="polite"></p>
</section>

<!-- 5. Underworld: water level with the step-by-step method -->
<section class="screen" id="scr-under" hidden>
  <h2 class="u-title" id="uTitle"></h2>
  <ol class="u-steps" id="uSteps"></ol>
  <div class="video" id="video"><span class="play"></span><span id="videoLbl"></span></div>
  <p class="instr" id="uInstr" aria-live="polite"></p>
  <div class="stage water">
    <div class="world" id="uwWorld">
      <div id="drifts"></div>
      <div id="numRow"></div>
      <div id="marks"></div>
      <div class="ubar" id="ubar" hidden tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="18" aria-valuenow="0"></div>
      <div class="udot" id="udot"></div>
    </div>
  </div>
  <form class="answer" id="uForm" hidden autocomplete="off">
    <input id="uInput" inputmode="decimal" dir="ltr">
    <button class="btn" id="uCheck" type="button"></button>
  </form>
  <p class="feed" id="uFeed" aria-live="polite"></p>
  <button class="btn" id="uBack" type="button" hidden></button>
</section>

<!-- Level 3: Decimal pilot -->
<section class="screen" id="scr-shoot" hidden>
  <p class="q-hint" id="shootHelp"></p>
  <div class="shoot-hud" dir="ltr"><span id="shootScore"></span><span class="lives" id="shootLives"></span></div>
  <div class="stage sky" id="shootStage">
    <div class="world" id="shootWorld">
      <div id="stars"></div>
      <div class="danger"></div>
      <div class="aim" id="aim"></div>
      <div class="falling" id="falling"></div>
      <div id="shots"></div>
      <div class="plane" id="plane"></div>
    </div>
    <div class="shoot-overlay" id="shootOverlay">
      <p id="shootMsg"></p>
      <button class="btn" id="shootGo" type="button"></button>
    </div>
  </div>
  <p class="feed" id="shootFeed" aria-live="polite"></p>
</section>

<!-- Level 1: Number line -->
<section class="screen" id="scr-nl" hidden>
  <p class="instr" id="nlInstr" aria-live="polite"></p>
  <div class="shoot-hud" dir="ltr"><span id="nlScore"></span><span id="nlRoundTxt"></span></div>
  <div class="stage sky" id="nlStage">
    <div class="world">
      <div id="nlMarks"></div>
      <div id="nlLine"></div>
      <div id="nlDrop"></div>
    </div>
  </div>
  <button class="btn" id="nlCheck" type="button"></button>
  <p class="feed" id="nlFeed" aria-live="polite"></p>
</section>

<!-- Level 5: Coordinates -->
<section class="screen" id="scr-co" hidden>
  <p class="instr" id="coInstr" aria-live="polite"></p>
  <div class="shoot-hud co-hud" dir="ltr"><span id="coScore"></span><span id="coRoundTxt"></span></div>
  <div class="co-wrap"><svg id="coSvg" viewBox="0 0 440 440" role="img"></svg></div>
  <div class="answer" id="coForm" hidden dir="ltr">

    <label class="co-in">y = <input id="coY" inputmode="decimal" autocomplete="off"></label>
    <button class="btn" id="coCheck" type="button"></button>
  </div>
  <p class="feed" id="coFeed" aria-live="polite"></p>
</section>

<!-- Level 6: Standard form (Standards Unit N4) -->
<section class="screen" id="scr-sfm" hidden>
  <p class="instr" id="sfmInstr" aria-live="polite"></p>
  <div class="shoot-hud" dir="ltr"><span id="sfmScore"></span><span id="sfmStage"></span></div>
  <div class="sfm-board" id="sfmBoard"></div>
  <button class="btn" id="sfmCheck" type="button" hidden></button>
  <p class="feed" id="sfmFeed" aria-live="polite"></p>
</section>

<!-- 6. Level cleared -->
<section class="screen" id="scr-done" hidden>
  <div class="intro-wrap">
    <p class="big-type" id="doneText"></p>
    <p class="sub" id="doneSub"></p>
    <button class="btn" id="mapBtn" type="button"></button>
  </div>
</section>


<!-- DIAGNOSTIC: the old land in black and white, with one path through six places -->
<section class="screen" id="scr-diag" hidden>
  <h1 class="title" id="dgTitle" style="font-size:clamp(30px,6vw,46px)"></h1>
  <p class="sub" id="dgNote" aria-live="polite"></p>
  <div class="dmap"><img id="dgImg" alt=""><svg id="dgSvg" viewBox="0 0 1280 720"></svg></div>
  <button class="btn" id="dgGo" type="button"></button>
</section>

<!-- GATE: one diagnostic or practice question on the billboard -->
<section class="screen" id="scr-gate" hidden>
  <h2 class="q-text" id="gText" aria-live="polite"></h2>
  <p class="q-hint" id="gHint"></p>
  <div class="g-fig" id="gFig" hidden></div>
  <div class="stage">
    <div class="world" id="gWorld">
      <div class="progress" id="gProg"></div>
      <div class="ground"></div>
      <div class="tag" id="gTagBox"><div class="paper" id="gTag" dir="ltr"></div><div class="stick"></div></div>
      <div class="board" id="gBoard">
        <div class="face" id="gFace"></div>
        <div class="pole"></div>
        <button class="btn check" id="gCheck" type="button"></button>
      </div>
      <div class="barrier"><div class="bar" id="gBar"></div><div class="post"></div></div>
      <div class="ball" id="gBall"></div>
    </div>
  </div>
  <p class="feed" id="gFeed" aria-live="polite"></p>
</section>

<!-- LEARNING REALM: six hexagons, white where both diagnostic questions were right -->
<section class="screen" id="scr-realm" hidden>
  <h1 class="title" id="rmTitle" style="font-size:clamp(30px,6vw,46px)"></h1>
  <p class="sub" id="rmNote"></p>
  <svg class="hexes realm" id="rmHex" viewBox="-300 -90 560 260"></svg>
  <ul class="legend" id="rmLegend"></ul>
</section>

<!-- TOPIC: watch, underworld, play -->
<section class="screen" id="scr-topic" hidden>

    <div class="tp-video" id="tpVideo"></div>

    <div class="tp-btns" id="tpGames"></div>
  </div>
  <button class="btn" id="tpBack" type="button"></button>
</section>

// write a number the local way: decimal sign per language, thin spaces between thousands (45 678)
function fmt(s) {
  const [w, d] = s.split(".");
  const ww = w.length >= 5 ? w.replace(/\B(?=(\d{3})+(?!\d))/g, "\u202F") : w;
  return d !== undefined ? ww + SEP[lang] + d : ww;
}
const iso = s => "⁦" + s + "⁩";            // keeps numbers left-to-right inside Arabic/Dari text
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));

const SVGNS = "http://www.w3.org/2000/svg";

// Typewriter for normal (multilingual) text
function typeInto(el, text, speed = 22) {
  const token = (el._tok = (el._tok || 0) + 1);
  if (reduce) { el.textContent = text; return Promise.resolve(); }
  return new Promise(res => {
    let i = 0;
    (function step() {
      if (el._tok !== token) return res();
      el.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(step, speed); else res();
    })();
  });
}

/* =====================================================================
   ROUNDING + QUESTION MAKERS
   Rounding works on the digits as text, so there are no computer rounding errors.
   ===================================================================== */
// mode "dp": round to n decimal places; mode "sf": round to n significant figures.
// Returns the rounded number as text, with every zero it needs (13.00, 0.0500, 45700).
function roundText(num, mode, n) {
  const [w, d = ""] = num.split(".");
  const digits = (w + d).split("").map(Number);
  let W = w.length;
  const first = digits.findIndex(x => x !== 0);
  let keep = mode === "dp" ? W + n - 1 : first + n - 1;      // index of the rounding digit
  while (digits.length < keep + 2) digits.push(0);
  const test = digits[keep + 1];                              // the test digit
  const out = digits.slice(0, keep + 1);
  if (test >= 5) {
    let i = keep;
    while (i >= 0 && out[i] === 9) { out[i] = 0; i--; }      // 9 + 1 = 10: write 0, carry 1
    if (i >= 0) out[i]++; else { out.unshift(1); W++; keep++; }
  }
  if (mode === "sf") {                                        // a carry can create a new first figure: still n figures
    const f = out.findIndex(x => x !== 0);
    out.length = Math.max(f + n, Math.min(out.length, W));
  }
  if (out.length <= W) return (out.join("") + "0".repeat(W - out.length)).replace(/^0+(?=\d)/, "");
  return out.slice(0, W).join("").replace(/^0+(?=\d)/, "") + "." + out.slice(W).join("");
}

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
const extra = () => (Math.random() < 0.5 ? String(rnd(0, 9)) : "");

// 2 decimal places (euro amounts, at most 99,99 € so they fit the wheels)
const DP_MAKERS = {
  up:     () => `${rnd(1, 49)}.${rnd(0, 9)}${rnd(0, 8)}${rnd(5, 9)}${extra()}`,     // rounds up, no 9 to topple
  down:   () => `${rnd(1, 49)}.${rnd(0, 9)}${rnd(0, 9)}${rnd(0, 4)}${extra()}`,     // stays the same
  topple: () => Math.random() < 0.5
    ? `${rnd(1, 48)}.${rnd(0, 8)}9${rnd(5, 9)}${extra()}`                            // 4.39|7 -> 4.40
    : `${rnd(1, 48)}.99${rnd(5, 9)}${extra()}`                                      // 12.99|6 -> 13.00
};
// 3 significant figures
const SF_MAKERS = {
  small:  () => `0.0${Math.random() < 0.5 ? "0" : ""}${rnd(1, 9)}${rnd(0, 9)}${rnd(0, 9)}${rnd(0, 9)}${extra()}`, // 0.004567 -> 0.00457
  whole:  () => `${rnd(1, 9)}${rnd(0, 9)}${rnd(0, 9)}${rnd(0, 9)}${rnd(0, 9)}`,                                 // 45678 -> 45700
  mixed:  () => `${rnd(1, 9)}${rnd(0, 9)}.${rnd(0, 9)}${rnd(0, 9)}${rnd(0, 9)}`,                                // 12.348 -> 12.3
  topple: () => pick([
    () => `${rnd(1, 8)}9.9${rnd(5, 9)}${extra()}`,                          // 29.97 -> 30.0
    () => `0.0${rnd(1, 8)}99${rnd(5, 9)}`,                                  // 0.04996 -> 0.0500
    () => `${rnd(1, 8)}.99${rnd(5, 9)}${extra()}`                           // 3.996 -> 4.00
  ])()
};
// true when rounding up has to carry past a 9
function topples(num, mode, n) {
  const ds = num.replace(".", "").split("").map(Number);
  const W = num.split(".")[0].length;
  const keep = mode === "dp" ? W + n - 1 : ds.findIndex(x => x !== 0) + n - 1;
  return (ds[keep + 1] ?? 0) >= 5 && ds[keep] === 9;
}
function makeQ(maker, mode, n, wantTopple) {
  for (let t = 0; t < 50; t++) {
    const num = maker();
    if (topples(num, mode, n) === wantTopple) return { n: num, ans: roundText(num, mode, n) };
  }
}
// Questions 1 and 2 are random and never topple; question 3 always has a 9 that topples over.
function makeDP() {
  return [...shuffle([DP_MAKERS.up, DP_MAKERS.down]).map(m => makeQ(m, "dp", 2, false)),
          makeQ(DP_MAKERS.topple, "dp", 2, true)];
}
function makeSF() {
  return [...shuffle([SF_MAKERS.small, SF_MAKERS.whole, SF_MAKERS.mixed]).slice(0, 2).map(m => makeQ(m, "sf", 3, false)),
          makeQ(SF_MAKERS.topple, "sf", 3, true)];
}

// Compare a typed answer with the correct one: "ok", "zeros" (right value, wrong zeros) or "no".
function normalise(s) {
  return s.trim()
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660)
    .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0)
    .replace(/[,٫]/g, ".").replace(/[\s  '’٬]/g, "");
}
function judge(raw, want) {
  const got = normalise(raw);
  if (got === want || (want.startsWith("0.") && got === want.slice(1))) return "ok";
  // whole-number answers typed with a thousands separator, e.g. 45,700 or 45.700
  if (!want.includes(".") && got.replace(/\./g, "") === want && /^\d{1,3}(\.\d{3})+$/.test(got)) return "ok";
  if (got !== "" && !isNaN(+got) && +got === +want) return "zeros";
  return "no";
}

/* =====================================================================
   DOT CURSOR (falls out of the i in Mathskills)
   ===================================================================== */
const cur = $("#cursor");
let cx = 0, cy = 0, fallen = false, followed = false;
const fine = matchMedia("(pointer: fine)").matches;
function setCur(x, y) { cx = x; cy = y; cur.style.transform = `translate(${x}px, ${y}px)`; }

function dropTittle() {
  const t = $("#tittle");
  const r = t.getBoundingClientRect();
  const s = $("#hexTitle").getBoundingClientRect();
  let x = r.left + r.width / 2, y = r.top + r.height / 2, vy = 0;
  const floor = s.top + (4 / 308) * s.height - 6;
  t.style.visibility = "hidden";
  cur.style.display = "block";
  setCur(x, y);
  if (reduce) { setCur(x, floor); fallen = true; return; }
  (function step() {
    vy += 0.55; y += vy;
    if (y >= floor) {
      y = floor; vy *= -0.42;
      if (Math.abs(vy) < 1.1) { setCur(x, y); fallen = true; afterFall(); return; }
    }
    setCur(x, y);
    requestAnimationFrame(step);
  })();
}
function afterFall() { if (!fine) setTimeout(() => { cur.style.display = "none"; }, 1500); }

addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" && e.pointerType !== "pen") return;
  if (!fallen) return;
  cur.style.display = "block";
  if (!followed) {
    followed = true;
    cur.classList.add("glide");
    setTimeout(() => cur.classList.remove("glide"), 380);
  }
  setCur(e.clientX, e.clientY);
  updateCursorLook();
});
// The dot turns black (the background colour) whenever it is over a white-filled hexagon,
// e.g. a "start" hexagon or the "R•unding" hexagon, and over filled buttons.
// It is checked on every move and after every screen change, so it never gets stuck.
function isFilledHex(hex) {
  if (!hex) return false;
  const poly = hex.querySelector("polygon");
  const fg = getComputedStyle(document.documentElement).getPropertyValue("--fg").trim();
  const probe = document.createElement("span");
  probe.style.color = fg; document.body.appendChild(probe);
  const fgRGB = getComputedStyle(probe).color; probe.remove();
  return getComputedStyle(poly).fill === fgRGB;
}
function updateCursorLook() {
  if (!followed) return;
  const el = document.elementFromPoint(cx, cy);
  if (!el || !el.closest) { cur.classList.remove("big", "inv"); return; }
  const hex = el.closest(".hex");
  const btn = el.closest(".btn, .wbtn");
  cur.classList.toggle("big", !!el.closest("button, input, .hex.on, .cell.pick, .ubar:not(.locked)"));
  cur.classList.toggle("inv", isFilledHex(hex) || !!(btn && btn.matches(":hover")));
}
// The hexagon's colour fades in over 0.15 s, so look again once it has finished.
document.addEventListener("transitionend", e => { if (e.target.closest && e.target.closest(".hex")) updateCursorLook(); });
document.addEventListener("mouseleave", () => { if (followed) cur.style.display = "none"; });

/* =====================================================================
   HEXAGONS
   ===================================================================== */
const R = 60, W = Math.sqrt(3) * R;
const CELLS = [[-W / 2, 0], [W / 2, 0], [-W, 90], [0, 90], [W, 90], [-W / 2, 180], [W / 2, 180]];
function hexPoints(x, y) {
  const p = [];
  for (let k = 0; k < 6; k++) {
    const a = Math.PI / 180 * (60 * k - 90);
    p.push((x + R * Math.cos(a)).toFixed(2) + "," + (y + R * Math.sin(a)).toFixed(2));
  }
  return p.join(" ");
}
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function addText(g, x, y, str, fs, cls) {
  const t = svgEl("text", { x, y, "font-size": fs, "data-fs": fs, "data-fit": 86, class: cls || "" });
  t.textContent = str;
  g.appendChild(t);
}
function fitLabels(svg) {
  svg.querySelectorAll("text[data-fit]").forEach(t => {
    t.setAttribute("font-size", t.dataset.fs);
    const len = t.getComputedTextLength(), max = +t.dataset.fit;
    if (len > max) t.setAttribute("font-size", (t.dataset.fs * max / len).toFixed(1));
  });
}
function activate(g, fn) {
  g.addEventListener("click", fn);
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } });
}

function buildTitle() {
  const svg = $("#hexTitle");
  svg.setAttribute("aria-label", Object.values(START).join(" · "));
  HEX_ORDER.flat().forEach((code, i) => {
    const [x, y] = CELLS[i];
    const g = svgEl("g", { class: "hex on", tabindex: 0, role: "button", "aria-label": START[code] });
    g.appendChild(svgEl("polygon", { points: hexPoints(x, y) }));
    addText(g, x, y, START[code], 19);
    activate(g, () => { lang = code; openDiag(); });
    svg.appendChild(g);
  });
}

const dotName = s => s.replace(/[oOоО]/, "•");   // "Rounding" -> "R•unding"

function openMap() {
  show("scr-map");
  const svg = $("#hexMap");
  svg.innerHTML = "";
  const ids = Object.keys(LEVELS);
  if (mode === "run" && ids.every(id => cleared[id])) mode = "results";
  const nextUp = ids.find(id => !cleared[id]);
  $("#mapNote").textContent = mode === "results" ? T(ids.every(id => perfect[id]) ? "resultsAll" : "resultsSome") : "";
  CELLS.forEach(([x, y], i) => {
    const id = ids.find(key => LEVELS[key].hex === i);
    // during the run only the next level is open (UNLOCK_ALL opens all); at the end every level is open
    const isOpen = !!id && (mode === "results" || id === nextUp || UNLOCK_ALL);
    const state = !id ? "" : mode === "results" ? (perfect[id] ? " done" : " practice") : cleared[id] ? " visited" : "";
    const g = svgEl("g", { class: "hex" + (isOpen ? " on" : "") + state });
    g.appendChild(svgEl("polygon", { points: hexPoints(x, y) }));
    if (isOpen) {
      const sub = mode === "results" && !perfect[id] ? T("practice") : T(LEVELS[id].sub);
      g.setAttribute("tabindex", 0);
      g.setAttribute("role", "button");
      g.setAttribute("aria-label", T(LEVELS[id].name) + " " + sub);
      addText(g, x, y - 9, dotName(T(LEVELS[id].name)), 18, "lbl");
      addText(g, x, y + 14, sub, 11, "lbl");
      activate(g, () => (mode === "results" && !perfect[id] ? practise(id) : startIntro(id)));
    }
    svg.appendChild(g);
  });
  fitLabels(svg);
}

/* =====================================================================
   BIG TYPEWRITER: old-school text typed letter by letter in the pixel font, in the player's language
   ===================================================================== */
function typeBig(el, text) {
  const token = (el._tok = (el._tok || 0) + 1);
  el.setAttribute("aria-label", text);
  el._finish = () => { el._tok++; el.textContent = text; el._finish = null; el._resolve && el._resolve(); };
  if (reduce) { el.textContent = text; return Promise.resolve(); }
  return new Promise(res => {
    el._resolve = res;
    let i = 0;
    (function step() {
      if (el._tok !== token) return;
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) { el._finish = null; return res(); }
      const ch = text[i - 1];
      const pause = /[:.!?؟]/.test(ch) && text[i] === " " ? 320 : /[,،]/.test(ch) && text[i] === " " ? 160 : 0;
      setTimeout(step, 45 + pause);                    // a short pause after punctuation, like an old text box
    })();
  });
}
const finishBig = el => el._finish && el._finish();

   ===================================================================== */
const wheels = [0, 0, 0, 0];
const ball = $("#ball"), bar = $("#bar"), trap = $("#trap"), world = $("#lvWorld");

function buildWheels() {
  const box = $("#wheels");
  box.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    if (i === 2) { const s = document.createElement("span"); s.className = "wsep"; s.id = "wsep"; box.appendChild(s); }
    const w = document.createElement("div");
    w.className = "wheel";
    w.innerHTML =
      `<button class="wbtn" type="button" aria-label="+1"><svg viewBox="0 0 14 10"><path d="M7 0 L14 10 H0 Z"/></svg></button>` +
      `<div class="win"><span>0</span></div>` +
      `<button class="wbtn" type="button" aria-label="−1"><svg viewBox="0 0 14 10"><path d="M0 0 H14 L7 10 Z"/></svg></button>`;
    const [up, , down] = w.children;
    up.addEventListener("click", () => spin(i, 1));
    down.addEventListener("click", () => spin(i, -1));
    w.querySelector(".win").addEventListener("wheel", e => { e.preventDefault(); spin(i, e.deltaY < 0 ? 1 : -1); }, { passive: false });
    box.appendChild(w);
  }
  const e = document.createElement("span"); e.className = "weur"; e.textContent = "€"; box.appendChild(e);
}
function spin(i, d) {
  if (busy) return;
  wheels[i] = (wheels[i] + d + 10) % 10;
  const span = document.querySelectorAll("#wheels .win span")[i];
  span.textContent = wheels[i];
  span.className = ""; void span.offsetWidth; span.className = d > 0 ? "roll-up" : "roll-down";
}
function paintWheels() { document.querySelectorAll("#wheels .win span").forEach((s, i) => { s.textContent = wheels[i]; s.className = ""; }); }
function paintProgress() {
  document.querySelectorAll("#prog i").forEach((d, i) => { d.classList.toggle("ok", solved[i] && !wrongQs.has(i)); d.classList.toggle("bad", wrongQs.has(i)); });
}

function placeBall(left, top, animate) {
  if (!animate) { ball.style.transition = "none"; }
  ball.style.left = left + "px"; ball.style.top = top + "px";
  if (!animate) { void ball.offsetWidth; ball.style.transition = ""; }
}

async function startLevel() {
  const cfg = LEVELS[lvl];
  show("scr-level");
  $("#checkBtn").textContent = T("check");
  $("#qHint").textContent = T(cfg.hint);
  $("#wheels").hidden = cfg.input !== "wheels";

  $("#typeIn").placeholder = T("ans");
  await setupQuestion();
}
const money = s => fmt(s) + (LEVELS[lvl].euro ? " €" : "");
async function setupQuestion() {
  busy = true;
  const q = QUESTIONS[qi], cfg = LEVELS[lvl];
  wheels.fill(0); paintWheels(); paintProgress();
  $("#typeIn").value = "";
  $("#wsep").textContent = SEP[lang];
  $("#tagNum").textContent = money(q.n);
  $("#qFeed").textContent = "";
  bar.classList.remove("open"); trap.classList.remove("open"); $("#hole").classList.remove("open");
  placeBall(-40, 332, false);
  world.classList.remove("fade");
  typeInto($("#qText"), T(cfg.q).replace("{n}", iso(money(q.n))));
  await wait(80);
  placeBall(96, 332, true);
  await wait(1100);
  busy = false;
  if (cfg.input === "type") $("#typeIn").focus({ preventScroll: true });
}
$("#typeIn").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#checkBtn").click(); } });
$("#checkBtn").addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  const q = QUESTIONS[qi];
  const v = wheels[0] * 1000 + wheels[1] * 100 + wheels[2] * 10 + wheels[3];
  const right = LEVELS[lvl].input === "wheels"
    ? v === Math.round(parseFloat(q.ans) * 100)
    : judge($("#typeIn").value, q.ans) === "ok";
  // right or wrong, the ball rolls on; a wrong answer is noted for practice at the end
  solved[qi] = true;
  if (!right) wrongQs.add(qi);
  paintProgress();
  $("#qFeed").textContent = right ? T("right") + "  " + iso(money(q.ans)) : T("wrongLater").replace("{x}", iso(money(q.ans)));
  {
    bar.classList.add("open");
    await wait(600);
    placeBall(880, 332, true);
    await wait(right ? 1200 : 2600);
    const next = solved.indexOf(false);
    if (next < 0) { lastWrong[lvl] = [...wrongQs]; return finishLevel(wrongQs.size === 0); }
    qi = next;
    world.classList.add("fade");
    await wait(320);
    setupQuestion();
  }
});

/* =====================================================================
   LEVEL 3: DECIMAL PILOT (centimetres into metres)
   A length in centimetres falls from the sky. 100 cm = 1 m, so turning it into metres means
   putting the decimal point with 2 digits after it. The plane at the bottom moves left and right and shoots
   the decimal point into the number. Right gap = exactly 2 digits after the point: the number
   disappears and scores a point. A number that reaches the plane costs a life.
   ===================================================================== */
const SHOOT = {
  places: 2,          // digits that must end up after the decimal point
  goal: 10,           // points needed to clear the level
  lives: 3,
  speed: 40,          // starting fall speed (pixels per second in the 800x420 world)
  speedUp: 5,         // extra speed per point
  cell: 48            // width of one digit (the gaps between digits are where the point can land)
};
const PLANE_Y = 356, DANGER_Y = 344, PLANE_W = 52;
const sw = $("#shootWorld"), planeEl = $("#plane"), aimEl = $("#aim"), fallEl = $("#falling"), shotsEl = $("#shots");
let sMiss = false;                 // any wrong shot or lost life in this level
let shooting = false, sScore = 0, sLives = SHOOT.lives, planeX = 400, targetX = null, queuedShot = false;
let keyDir = 0, lastShot = 0, lastT = 0, num = null, shots = [];

// pixel-art plane seen from above, nose pointing up (the red pixel is where the dot leaves)
(function drawPlane() {
  const art = ["......#......", ".....###.....", ".....###.....", "....#####....", ".###########.",
               "#############", ".....###.....", ".....###.....", "....#####....", "...##...##..."];
  let r = "";
  art.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === "#") r += `<rect x="${x * 4}" y="${y * 4}" width="4" height="4"${y === 0 ? ' class="nose"' : ""}/>`;
  }));
  planeEl.innerHTML = `<svg viewBox="0 0 52 40" aria-hidden="true">${r}</svg>`;
})();
(function drawStars() {
  const box = $("#stars");
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("i");
    s.className = "star";
    s.style.left = rnd(4, 794) + "px"; s.style.top = rnd(4, 330) + "px";
    box.appendChild(s);
  }
})();

const heartSVG = '<svg viewBox="0 0 7 6" aria-hidden="true"><path d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/></svg>';
function paintShootHud() {
  $("#shootScore").textContent = `${T("points")}: ${sScore}/${SHOOT.goal}`;
  $("#shootLives").innerHTML = Array.from({ length: SHOOT.lives }, (_, i) =>
    `<span class="heart${i < sLives ? "" : " lost"}">${heartSVG}</span>`).join("");
  $("#shootLives").setAttribute("aria-label", `${sLives}/${SHOOT.lives}`);
}

function startShooter() {
  show("scr-shoot");
  $("#shootHelp").textContent = T("shootHelp");
  $("#shootFeed").textContent = "";
  sScore = 0; sLives = SHOOT.lives; sMiss = false;
  paintShootHud();
  clearShots();
  fallEl.innerHTML = ""; num = null;
  planeX = 400; targetX = null; placePlane();
  overlay(T("play"), "");
}
function overlay(button, msg) {
  shooting = false;
  $("#shootMsg").textContent = msg;
  $("#shootMsg").hidden = !msg;
  $("#shootGo").textContent = button;
  $("#shootOverlay").hidden = false;
  $("#shootGo").focus({ preventScroll: true });
}
$("#shootGo").addEventListener("click", () => {
  if (sLives <= 0) { sScore = 0; sLives = SHOOT.lives; paintShootHud(); }
  $("#shootOverlay").hidden = true;
  $("#shootFeed").textContent = "";
  shooting = true;
  if (!num) spawnNumber();
  lastT = performance.now();
  requestAnimationFrame(loop);
});

function spawnNumber() {
  const n = pick([2, 3, 3, 4, 4, 4, 5, 5, 6]);
  const digits = String(rnd(1, 9)) + Array.from({ length: n - 1 }, () => rnd(0, 9)).join("");
  const width = n * SHOOT.cell;
  num = { digits, n, x: rnd(30, 800 - 30 - width - 90), y: -50, done: false };   // room for the unit on the right
  fallEl.className = "falling";
  fallEl.style.left = num.x + "px";
  fallEl.style.top = num.y + "px";
  fallEl.innerHTML = [...digits].map((d, i) => `<span class="fcell" style="left:${i * SHOOT.cell}px">${d}</span>`).join("") +
    `<span class="funit" id="funit" style="left:${n * SHOOT.cell + 14}px">${T("unitCm")}</span>`;   // a length in centimetres
}
function placePlane() {
  planeEl.style.left = (planeX - PLANE_W / 2) + "px";
  aimEl.style.left = planeX + "px";
}
function clearShots() { shots.forEach(s => s.el.remove()); shots = []; }

function fire() {
  const now = performance.now();
  if (!shooting || now - lastShot < 250) return;
  lastShot = now;
  const el = document.createElement("i");
  el.className = "shot";
  shotsEl.appendChild(el);
  shots.push({ x: planeX, y: PLANE_Y - 4, el });
}

function loop(t) {
  if (!shooting || current !== "scr-shoot") { shooting = false; return; }
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  // plane: keys move it; otherwise it glides to where the mouse or finger is
  if (keyDir) { planeX += keyDir * 380 * dt; targetX = null; }
  else if (targetX !== null) {
    const d = targetX - planeX, step = 520 * dt;
    planeX = Math.abs(d) <= step ? targetX : planeX + Math.sign(d) * step;
    if (queuedShot && Math.abs(targetX - planeX) < 1) { queuedShot = false; fire(); }
  }
  planeX = Math.max(PLANE_W / 2, Math.min(800 - PLANE_W / 2, planeX));
  placePlane();
  // the falling number
  if (num && !num.done) {
    num.y += (SHOOT.speed + SHOOT.speedUp * sScore) * dt;
    fallEl.style.top = num.y + "px";
    if (num.y + 44 >= DANGER_Y) crash();
  }
  // the decimal dots flying up
  for (const s of shots.slice()) {
    s.y -= 620 * dt;
    s.el.style.left = s.x + "px"; s.el.style.top = s.y + "px";
    if (num && !num.done && s.y <= num.y + 40 && s.y >= num.y - 4) {
      const rel = s.x - num.x, g = Math.round(rel / SHOOT.cell);
      if (rel >= -SHOOT.cell / 2 && rel <= num.n * SHOOT.cell + SHOOT.cell / 2) { hit(s, Math.max(0, Math.min(num.n, g))); continue; }
    }
    if (s.y < -20) { s.el.remove(); shots.splice(shots.indexOf(s), 1); }
  }
  requestAnimationFrame(loop);
}

// the decimal point lands in gap g (0 = before the first digit, n = after the last)
function hit(s, g) {
  s.el.remove(); shots.splice(shots.indexOf(s), 1);
  const sep = document.createElement("span");
  sep.className = "fsep";
  sep.textContent = SEP[lang];
  sep.style.left = (g * SHOOT.cell) + "px";
  fallEl.appendChild(sep);
  if (num.n - g === SHOOT.places) {
    num.done = true;
    if (g === 0) {                                     // 57 -> 0.57: a 0 appears in front of the point
      const z = document.createElement("span");
      z.className = "fcell zero"; z.textContent = "0"; z.style.left = (-SHOOT.cell + 6) + "px";
      fallEl.appendChild(z);
    }
    sScore++;
    paintShootHud();
    const value = (g === 0 ? "0" : num.digits.slice(0, g)) + "." + num.digits.slice(g);
    const unit = $("#funit"); unit.textContent = T("unitM"); unit.classList.add("m");   // centimetres become metres
    $("#shootFeed").textContent = T("right") + "  " + iso(`${fmt(num.digits)} ${T("unitCm")} = ${fmt(value)} ${T("unitM")}`);
    const plus = document.createElement("span");
    plus.className = "plus1"; plus.textContent = "+1";
    plus.style.left = (num.x + num.n * SHOOT.cell + 90) + "px"; plus.style.top = num.y + "px";   // to the right of the unit
    sw.appendChild(plus); setTimeout(() => plus.remove(), 1000);
    fallEl.classList.add("scored");
    setTimeout(() => {
      if (sScore >= SHOOT.goal) { shooting = false; clearShots(); finishLevel(!sMiss); return; }
      if (shooting) spawnNumber();
    }, 750);
  } else {
    sep.classList.add("bad");
    sMiss = true;
    $("#shootFeed").textContent = T("shootWrong");
    setTimeout(() => sep.remove(), 650);
  }
}

function crash() {
  num.done = true;
  fallEl.querySelectorAll(".fcell").forEach(c => c.style.setProperty("--dx", rnd(-120, 120) + "px"));
  fallEl.classList.add("crash");
  sLives--; sMiss = true;
  paintShootHud();
  planeEl.classList.remove("hit"); void planeEl.offsetWidth; planeEl.classList.add("hit");
  if (sLives <= 0) {
    setTimeout(() => { num = null; fallEl.innerHTML = ""; clearShots(); overlay(T("again"), T("gameOver")); }, 900);
  } else {
    setTimeout(() => { if (shooting) spawnNumber(); }, 900);
  }
}

/* controls: arrow keys (or A/D) and space bar; mouse or finger moves the plane, a click or tap shoots */
addEventListener("keydown", e => {
  if (current !== "scr-shoot") return;
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keyDir = -1; e.preventDefault(); }
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keyDir = 1; e.preventDefault(); }
  if ((e.code === "Space" || e.key === "ArrowUp") && shooting) { e.preventDefault(); fire(); }
});
addEventListener("keyup", e => {
  if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && keyDir < 0) keyDir = 0;
  if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && keyDir > 0) keyDir = 0;
});
const shootStage = $("#shootStage");
// inside the playing field the dot cursor would look like a flying decimal point, so it hides there
shootStage.addEventListener("pointerenter", () => cur.classList.add("off"));
shootStage.addEventListener("pointerleave", () => cur.classList.remove("off"));
const worldX = e => { const r = shootStage.getBoundingClientRect(); return (e.clientX - r.left) / (shootStage.clientWidth / 800); };
shootStage.addEventListener("pointermove", e => {
  if (!shooting || e.pointerType === "touch" && e.buttons === 0) return;
  targetX = worldX(e);
});
shootStage.addEventListener("pointerdown", e => {
  if (!shooting || e.target.closest(".shoot-overlay")) return;
  e.preventDefault();
  targetX = worldX(e);
  if (Math.abs(targetX - planeX) < 2) fire(); else queuedShot = true;   // glide there, then shoot
});


/* =====================================================================
   LEVEL 1: NUMBER LINE (place & round)
   Each round: a number line with 11 marks, only two of them labelled.
   1. Complete it: work out the step and type the 2 missing labels (one is always outside the given two).
   2. A number falls: steer it so it lands in its place between two marks.
   3. Round it: click the nearest mark, which is the rounded number.
   Rounds go from tens to hundredths, ending with exactly the skill of Level 1 (2 decimal places).
   ===================================================================== */
const NL = {
  steps: [10, 1, 0.1, 0.01],  // one round per step: tens, whole numbers, tenths, hundredths
  perRound: 2,                // falling numbers per round
  x0: 50, gap: 70,            // first mark and distance between marks (800x420 world)
  lineY: 300,
  fall: 40, fast: 280,        // fall speed and "drop faster" speed (pixels per second)
  hit: 0.35                   // a landing counts if it is within this part of a gap from the right spot
};
const nlLineEl = $("#nlLine"), nlDropEl = $("#nlDrop"), nlMarksEl = $("#nlMarks"), nlStage = $("#nlStage");
let nl = null, nlKey = 0, nlFastKey = false, nlTargetX = null, nlLast = 0;

// numbers are kept as whole numbers of "units" (1, 0.1, 0.01 or 0.001), so there is no computer rounding
const kStr = (k, dec) => {
  if (dec <= 0) return String(k);
  const s = String(k).padStart(dec + 1, "0");
  return s.slice(0, -dec) + "." + s.slice(-dec);
};
const tickX = i => NL.x0 + i * NL.gap;

function nlMakeRound(r) {
  const dec = r;                                             // decimals of the falling numbers
  const Sk = r === 0 ? rnd(1, 9) * 100                       // 100 … 900, marks every 10
           : r === 1 ? rnd(1, 9) * 100                       // 10 … 90 (in tenths), marks every 1
           : r === 2 ? rnd(1, 9) * 100                       // 1 … 9 (in hundredths), marks every 0.1
           :           (rnd(1, 9) * 10 + rnd(0, 9)) * 100;   // 1.0 … 9.9 (in thousandths), marks every 0.01
  const tickK = i => Sk + i * 10;                            // mark i, in the same units
  const label = i => r === 0 ? String(tickK(i)) : kStr(tickK(i) / 10, dec - 1);
  const i1 = rnd(0, 4), i2 = i1 + pick([2, 3, 4, 5]);
  const others = [...Array(11).keys()].filter(i => i !== i1 && i !== i2);
  const outside = others.filter(i => i < i1 || i > i2);
  const b1 = pick(outside.length ? outside : others);
  const b2 = pick(others.filter(i => i !== b1 && Math.abs(i - b1) > 1));
  const nums = [];
  while (nums.length < NL.perRound) {
    const i = rnd(0, 9), f = pick([1, 2, 3, 4, 6, 7, 8, 9]);  // never exactly halfway
    if (!nums.some(n => n.i === i)) nums.push({ i, f, text: kStr(tickK(i) + f, dec), near: f >= 5 ? i + 1 : i });
  }
  return { r, label, given: [i1, i2], blanks: [b1, b2].sort((a, b) => a - b), nums };
}

function startNumberLine() {
  show("scr-nl");
  $("#nlCheck").textContent = T("check");
  nl = { round: 0, score: 0, total: NL.steps.length * (2 + 2 * NL.perRound) };
  nlNewRound();
}
function nlHud() {
  $("#nlScore").textContent = `${T("points")}: ${nl.score}/${nl.total}`;
  $("#nlRoundTxt").textContent = `${T("nlLine")} ${nl.round + 1}/${NL.steps.length}`;
}
function nlNewRound() {
  nl.R = nlMakeRound(nl.round);
  nl.phase = "fill"; nl.ni = 0; nl.firstCheck = true;
  nlHud();
  nlDropEl.innerHTML = ""; nlMarksEl.innerHTML = "";
  $("#nlFeed").textContent = "";
  // the line, its 11 marks, 2 labels, 2 boxes to fill in
  let h = `<div class="nl-axis"></div>`;
  for (let i = 0; i <= 10; i++) {
    const x = tickX(i);
    h += `<div class="nl-tick" data-i="${i}" style="left:${x}px"></div>`;
    if (nl.R.blanks.includes(i)) h += `<input class="nl-in" data-i="${i}" style="left:${x}px" inputmode="decimal" autocomplete="off" dir="ltr" aria-label="${i + 1}">`;
    else h += `<span class="nl-lab${nl.R.given.includes(i) ? "" : " hid"}" data-i="${i}" style="left:${x}px">${fmt(nl.R.label(i))}</span>`;
  }
  nlLineEl.innerHTML = h;
  $("#nlCheck").hidden = false;
  typeInto($("#nlInstr"), T("nlFill"));
  nlLineEl.querySelector(".nl-in").focus({ preventScroll: true });
}

/* 1. complete the number line */
function nlCheckFill() {
  if (!nl || nl.phase !== "fill") return;
  let allOk = true;
  nlLineEl.querySelectorAll(".nl-in").forEach(inp => {
    const want = +nl.R.label(+inp.dataset.i), got = normalise(inp.value);
    const ok = got !== "" && !isNaN(+got) && Math.abs(+got - want) < 1e-9;
    inp.classList.remove("bad"); void inp.offsetWidth;
    if (ok) { if (!inp.classList.contains("ok") && nl.firstCheck) nl.score++; inp.classList.add("ok"); inp.disabled = true; }
    else { inp.classList.add("bad"); allOk = false; }
  });
  nl.firstCheck = false;
  nlHud();
  if (!allOk) { $("#nlFeed").textContent = T("nlWrongFill"); return; }
  // the line is complete: the filled boxes become labels, the other labels appear
  nl.phase = "wait";
  $("#nlCheck").hidden = true;
  $("#nlFeed").textContent = "";
  nlLineEl.querySelectorAll(".nl-in").forEach(inp => {
    const s = document.createElement("span");
    s.className = "nl-lab filled"; s.dataset.i = inp.dataset.i; s.style.left = inp.style.left;
    s.textContent = fmt(nl.R.label(+inp.dataset.i));
    inp.replaceWith(s);
  });
  nlLineEl.querySelectorAll(".nl-lab.hid").forEach((s, n) => setTimeout(() => s.classList.replace("hid", "rev"), 60 * n));
  typeInto($("#nlInstr"), T("nlFilled"));
  setTimeout(nlNextNumber, 1800);
}
$("#nlCheck").addEventListener("click", nlCheckFill);
nlLineEl.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("nl-in")) { e.preventDefault(); nlCheckFill(); } });

/* 2. a number falls; steer it into place */
function nlNextNumber() {
  const n = nl.R.nums[nl.ni];
  if (!n) {                                                  // round finished
    nl.round++;
    if (nl.round >= NL.steps.length) { const ok = nl.score === nl.total; nl = null; finishLevel(ok); return; }
    return setTimeout(nlNewRound, 400);
  }
  nl.cur = n;
  nl.x = 400; nl.y = 10; nlTargetX = null;
  nlDropEl.innerHTML = `<div class="nl-guide" id="nlGuide"></div><div class="nl-num" id="nlNum">${fmt(n.text)}</div>`;
  nl.h = $("#nlNum").offsetHeight;
  nl.phase = "fall";
  if (nl.ni === 0) typeInto($("#nlInstr"), T("nlDrop"));
  nlLast = performance.now();
  requestAnimationFrame(nlLoop);
}
function nlLoop(t) {
  if (!nl || nl.phase !== "fall" || current !== "scr-nl") return;
  const dt = Math.min(0.05, (t - nlLast) / 1000); nlLast = t;
  if (nlKey) { nl.x += nlKey * 300 * dt; nlTargetX = null; }
  else if (nlTargetX !== null) { const d = nlTargetX - nl.x, s = 900 * dt; nl.x = Math.abs(d) <= s ? nlTargetX : nl.x + Math.sign(d) * s; }
  nl.x = Math.max(NL.x0 - 20, Math.min(tickX(10) + 20, nl.x));
  nl.y += (nlFastKey ? NL.fast : NL.fall) * dt;
  const tip = nl.y + nl.h + 12;                              // the point of the little arrow under the number
  const num = $("#nlNum"), guide = $("#nlGuide");
  num.style.left = nl.x + "px"; num.style.top = nl.y + "px";
  guide.style.left = nl.x + "px"; guide.style.top = tip + "px"; guide.style.height = Math.max(0, NL.lineY - tip) + "px";
  if (tip >= NL.lineY - 2) return nlLand();
  requestAnimationFrame(nlLoop);
}
async function nlLand() {
  nl.phase = "landed";
  const n = nl.cur, tx = tickX(n.i) + n.f / 10 * NL.gap;
  const ok = Math.abs(nl.x - tx) <= NL.hit * NL.gap;
  nlDropEl.innerHTML = "";
  const mark = document.createElement("div"); mark.className = "nl-mark"; mark.style.left = nl.x + "px";
  const lab = document.createElement("div"); lab.className = "nl-mlab"; lab.style.left = nl.x + "px"; lab.textContent = fmt(n.text);
  lab.style.top = (nl.ni % 2 ? 214 : 252) + "px";            // two numbers per line: keep their labels apart
  nlMarksEl.append(mark, lab);
  if (ok) { nl.score++; $("#nlFeed").textContent = T("nlLandOk"); }
  else { $("#nlFeed").textContent = T("nlLandNo"); mark.classList.add("moved"); }
  nlHud();
  await wait(ok ? 200 : 300);
  mark.style.left = tx + "px"; lab.style.left = tx + "px";    // settle exactly in its place
  await wait(ok ? 400 : 900);
  // 3. round it: click the nearest mark
  nl.phase = "round"; nl.firstRound = true; nl.markEl = mark; nl.tx = tx;
  nlLineEl.querySelectorAll(".nl-tick").forEach(t => t.classList.add("pick"));
  typeInto($("#nlInstr"), T("nlRound"));
}
nlLineEl.addEventListener("click", async e => {
  const t = e.target.closest(".nl-tick, .nl-lab");
  if (!t || !nl || nl.phase !== "round") return;
  const i = +t.dataset.i, n = nl.cur;
  const tick = nlLineEl.querySelector(`.nl-tick[data-i="${i}"]`);
  if (i !== n.near) {
    nl.firstRound = false;
    tick.classList.remove("no"); void tick.offsetWidth; tick.classList.add("no");
    $("#nlFeed").textContent = T("nlRoundNo");
    return;
  }
  nl.phase = "wait";
  if (nl.firstRound) nl.score++;
  nlHud();
  nlLineEl.querySelectorAll(".nl-tick").forEach(x => x.classList.remove("pick"));
  tick.classList.add("yes");
  const a = document.createElement("div");                    // a little jump from the number to its nearest mark
  a.className = "nl-hop";
  a.style.left = Math.min(nl.tx, tickX(i)) + "px"; a.style.width = Math.max(6, Math.abs(tickX(i) - nl.tx)) + "px";
  nlMarksEl.appendChild(a);
  $("#nlFeed").textContent = T("nlRoundOk").replace("{x}", iso(fmt(n.text))).replace("{y}", iso(fmt(nl.R.label(i))));
  await wait(1700);
  tick.classList.remove("yes");
  nl.ni++;
  nlNextNumber();
});

/* controls while a number falls: arrow keys (down or space = faster), mouse or finger */
addEventListener("keydown", e => {
  if (current !== "scr-nl" || !nl || nl.phase !== "fall") return;
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { nlKey = -1; e.preventDefault(); }
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { nlKey = 1; e.preventDefault(); }
  if (e.key === "ArrowDown" || e.code === "Space") { nlFastKey = true; e.preventDefault(); }
});
addEventListener("keyup", e => {
  if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && nlKey < 0) nlKey = 0;
  if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && nlKey > 0) nlKey = 0;
  if (e.key === "ArrowDown" || e.code === "Space") nlFastKey = false;
});
const nlWorldX = e => { const r = nlStage.getBoundingClientRect(); return (e.clientX - r.left) / (nlStage.clientWidth / 800); };
nlStage.addEventListener("pointermove", e => {
  if (!nl || nl.phase !== "fall" || (e.pointerType === "touch" && e.buttons === 0)) return;
  nlTargetX = nlWorldX(e);
});
nlStage.addEventListener("pointerdown", e => {
  if (!nl || nl.phase !== "fall") return;
  nlTargetX = nlWorldX(e);
});

/* =====================================================================
   LEVEL 5: COORDINATES (a dot-to-dot that draws a picture)
   Round 1: whole numbers, first quadrant. Round 2: all four quadrants.
   Round 3: halves, with only whole numbers labelled. Round 4: read the coordinates of a flashing point.
   ===================================================================== */
const CO_ROUNDS = [
  { min: 0,  max: 10, step: 1,   shapes: [
      [[5, 9], [7, 6], [7, 2], [5, 1], [3, 2], [3, 6]],                              // rocket
      [[2, 1], [8, 1], [8, 5], [5, 8], [2, 5]],                                      // house
      [[1, 5], [3, 7], [6, 7], [8, 5], [9, 7], [9, 3], [8, 5], [6, 3], [3, 3]] ] },  // fish
  { min: -5, max: 5,  step: 1,   shapes: [
      [[0, 4], [1, 1], [4, 0], [1, -1], [0, -4], [-1, -1], [-4, 0], [-1, 1]],        // star
      [[-4, 1], [1, 1], [1, 3], [4, 0], [1, -3], [1, -1], [-4, -1]] ] },             // arrow
  { min: -4, max: 4,  step: 0.5, shapes: [
      [[0, 3.5], [2.5, 0.5], [1.5, -3], [-1.5, -3], [-2.5, 0.5]],                    // gem
      [[-3.5, -2], [-3.5, 2.5], [-1.5, 0.5], [0, 3], [1.5, 0.5], [3.5, 2.5], [3.5, -2]] ] }, // crown
  { min: -4, max: 4,  step: 0.5, read: 3 }                                           // read the coordinates
];
const CO = { size: 440, pad: 34 };
const coSvg = $("#coSvg");
let co = null;

const coPair = (x, y) => {                                   // (3, -2) or (1,5; -2) where the comma is the decimal sign
  const sep = lang === "de" ? " | " : SEP[lang] === "." ? ", " : (RTL[lang] ? "؛ " : "; ");   // German schools write (3 | -2)
  return "(" + fmt(String(x)) + sep + fmt(String(y)) + ")";
};
function coPx(x, y) {
  const r = co.R, u = (CO.size - 2 * CO.pad) / (r.max - r.min);
  return [CO.pad + (x - r.min) * u, CO.size - CO.pad - (y - r.min) * u];
}
function coDrawGrid() {
  const r = co.R, svgns = SVGNS;
  let h = "";
  for (let v = r.min; v <= r.max + 1e-9; v = +(v + r.step).toFixed(2)) {
    const [x] = coPx(v, 0), [, y] = coPx(0, v), whole = Math.abs(v - Math.round(v)) < 1e-9;
    h += `<line class="co-grid${whole ? "" : " half"}" x1="${x}" y1="${CO.pad}" x2="${x}" y2="${CO.size - CO.pad}"/>`;
    h += `<line class="co-grid${whole ? "" : " half"}" x1="${CO.pad}" y1="${y}" x2="${CO.size - CO.pad}" y2="${y}"/>`;
  }
  const [ox, oy] = coPx(Math.max(r.min, 0), Math.max(r.min, 0));
  h += `<line class="co-axis" x1="${CO.pad - 6}" y1="${oy}" x2="${CO.size - CO.pad + 10}" y2="${oy}"/>`;
  h += `<line class="co-axis" x1="${ox}" y1="${CO.size - CO.pad + 6}" x2="${ox}" y2="${CO.pad - 10}"/>`;
  h += `<text class="co-name" x="${CO.size - CO.pad + 14}" y="${oy + 5}">x</text><text class="co-name" x="${ox - 5}" y="${CO.pad - 16}">y</text>`;
  for (let v = Math.ceil(r.min); v <= r.max; v++) {           // only whole numbers are labelled
    const [x] = coPx(v, 0), [, y] = coPx(0, v);
    if (v !== 0 || r.min === 0) h += `<text class="co-lab" x="${x}" y="${oy + 18}">${v}</text>`;
    if (v !== 0) h += `<text class="co-lab" x="${ox - 12}" y="${y + 4}">${v}</text>`;
  }
  h += `<polyline id="coLine" class="co-line" points=""/><g id="coDots"></g><g id="coTemp"></g>`;
  coSvg.innerHTML = h;
}
function coHud() {
  $("#coScore").textContent = `${T("points")}: ${co.score}/${co.total}`;
  $("#coRoundTxt").textContent = `${T("coGrid")} ${co.round + 1}/${CO_ROUNDS.length}`;
}
function startCoords() {
  show("scr-co");
  $("#coCheck").textContent = T("check");
  co = { round: 0, score: 0 };
  co.shapes = CO_ROUNDS.map(r => r.read ? null : pick(r.shapes));       // a new set of pictures every time
  co.total = CO_ROUNDS.reduce((t, r, i) => t + (r.read || co.shapes[i].length), 0);

}
function coNewRound() {
  co.R = CO_ROUNDS[co.round];

      const p = [rnd(-8, 8) / 2, rnd(-8, 8) / 2];

        if (p[0] < 0 || p[1] < 0) if (!co.pts.some(q => q[0] === p[0] && q[1] === p[1])) co.pts.push(p);

}
function coAskPlot() {

}
coSvg.addEventListener("click", e => {
  if (!co || co.R.read || co.busy) return;

  const p = pt.matrixTransform(coSvg.getScreenCTM().inverse());
  const r = co.R, u = (CO.size - 2 * CO.pad) / (r.max - r.min);
  const snap = v => Math.round(v / r.step) * r.step;
  const gx = +snap(r.min + (p.x - CO.pad) / u).toFixed(2), gy = +snap(r.min + (CO.size - CO.pad - p.y) / u).toFixed(2);
  if (gx < r.min || gx > r.max || gy < r.min || gy > r.max) return;
  const [wx, wy] = co.pts[co.i];
  if (gx === wx && gy === wy) {

    setTimeout(() => { $("#coTemp").innerHTML = ""; }, 1100);

/* round 4: read the coordinates of a flashing point */
function coNextRead() {

/* =====================================================================
   LEVEL 6: STANDARD FORM (based on the Standards Unit activity N4 "Estimating length, using standard form")
   Stage 1 (card sets A + B): match each object with its length.
   Stage 2 (card set C): write each length in standard form, a × 10ⁿ.
   Stage 3 (card set D): put the objects in order of size, then place the "× …" arrows between neighbours.
   ===================================================================== */
const SFM_ITEMS = [   // id, length in metres, standard form a × 10^n  (the 1p coin of N4 is a 1-cent coin here)
  { id: "atom",   len: "0.00000000000001",        a: 1, n: -14 },

  { id: "flyeye", len: "0.0008",                  a: 8, n: -4 },
  { id: "coin",   len: "0.02",                    a: 2, n: -2 },
  { id: "door",   len: "2",                       a: 2, n: 0 },
  { id: "sky",    len: "400",                     a: 4, n: 2 },
  { id: "mount",  len: "8000",                    a: 8, n: 3 },
  { id: "earth",  len: "20000000",                a: 2, n: 7 },
  { id: "moon",   len: "400000000",               a: 4, n: 8 },
  { id: "galaxy", len: "800000000000000000000",   a: 8, n: 20 }

const sfmLen = it => {                                        // 8 000 m, 0,0008 m, 800 000 000 000 000 000 000 m

function sfmHud() {

/* ---------- stage 1: match each object with its length ---------- */

/* ---------- stage 3: order of size, then the comparison arrows ---------- */
function sfmStage3() {

function sfmStage3Click(e) {

    if (!sfm.missOrder) sfm.score++;
