# DP Economics, SL and HL. The guide asks for no prior learning; its maths appears as the
# calculations named in the syllabus. Prior skills are the skills those calculations use, plus
# straight-line graphs and functions, which the owner rates as more important (2026-11-10).
subject: Economics
status: ready
courses: {SL: DP Economics SL, HL: DP Economics HL}
guide: {title: Economics guide, first_assessment: 2022, published: "February 2020, updated May 2020", section: "Syllabus content: calculations"}
prior_knowledge:
  - {id: e1, text: "Adding up and dividing data (GDP, per person figures, balance of payments)", skills: [arith], origin: guide}
  - {id: e2, text: "Decimals, fractions and percentages (rates such as unemployment)", skills: [dfp], origin: guide}
  - {id: e3, text: "Percentage change (elasticities, growth, inflation, currency values)", skills: [pct_change], origin: guide}
  - {id: e4, text: Ratios (an elasticity is a ratio of two percentage changes), skills: [ratio_recip], origin: guide}
  - {id: e5, text: "Rearranging a formula to find the missing value (for example the change in price from PED)", skills: [rearrange], origin: guide}
  - {id: e6, text: Multiplying by a factor (nominal to real values with a price deflator), skills: [mult], origin: guide}
  - {id: e7, text: "Negative numbers (real interest rates, deficits, negative elasticities)", skills: [neg], origin: guide}
  - {id: e8, text: Converting prices between currencies, skills: [currency], origin: guide}
  - {id: e9, text: Reading values from economic diagrams, skills: [graph_read], origin: guide}
  - {id: e14, text: "Straight-line graphs: gradient and intercept (demand and supply curves)", skills: [line_graphs], origin: curator}
  - {id: e15, text: "Functions: one quantity depending on another (quantity demanded depending on price)", skills: [functions], origin: curator}
  - {id: e10, text: "Areas of rectangles and triangles in diagrams (surplus, welfare loss, tax revenue)", skills: [area_vol], levels: [HL], origin: guide}
  - {id: e11, text: Weighted price indices, skills: [weighted_index], levels: [HL], origin: guide}
  - {id: e12, text: "Reciprocals (the multiplier 1 / (1 - MPC))", skills: [ratio_recip], levels: [HL], origin: guide}
  - {id: e13, text: "Linear demand and supply functions, and solving them for equilibrium", skills: [lineq, subst, simul], levels: [HL], origin: guide}
hexagon: {SL: [pct_change, ratio_recip, rearrange, line_graphs, functions, neg, graph_read], HL: [pct_change, ratio_recip, rearrange, line_graphs, functions, area_vol, lineq]}
